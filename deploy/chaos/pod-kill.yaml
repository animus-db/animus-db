# UNVALIDATED draft (never applied to a cluster; see deploy/chaos/README.md).
# SIGKILL one pod of the `chaos` AnimusCluster. gracePeriod 0 is a hard kill
# (no SIGTERM drain), the k8s analogue of the bare harness's `kill -9`; the
# StatefulSet restarts it on the same PVC. Mutating the replica set of a pod
# that is currently the control leader is the interesting case: re-run with
# a pod name chosen from GET /admin/raft `is_leader`.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: animus-pod-kill
  namespace: animus-chaos
spec:
  action: pod-kill
  mode: one
  gracePeriod: 0
  selector:
    namespaces: [animus-chaos]
    labelSelectors:
      app.kubernetes.io/name: animusdb
      app.kubernetes.io/instance: chaos
