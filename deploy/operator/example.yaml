apiVersion: animusdb.io/v1alpha1
kind: AnimusCluster
metadata:
  name: example
  namespace: default
spec:
  image: ghcr.io/animus-db/animusd:latest
  nodes: 3
  # controlNodes defaults to min(3, nodes) when omitted; spelled out here
  # for clarity. Immutable after creation.
  controlNodes: 3
  storage:
    size: 10Gi
    # storageClassName: fast-ssd
    ephemeral: false
  basePort: 14000
  clientService:
    type: ClusterIP
  quiesceAfterSecs: 5
  # dynamoAuthSecretName: example-dynamo-credentials
  # S3-compatible backup/segment stores (S-04 PR 3). Either or both of
  # backupStore/segmentStore may be set; credentialsSecretName must name a
  # pre-existing Secret (same namespace) with keys access_key_id/
  # secret_access_key — this operator only ever mounts it, never creates or
  # writes one. egressCidrs defaults to ["0.0.0.0/0"] since a NetworkPolicy
  # cannot express a hostname allowlist: NARROW THIS to your object store's
  # real address range in any environment where open egress on that port is
  # unacceptable.
  # s3:
  #   backupStore: "s3://my-backups-bucket?endpoint=https://s3.us-east-1.amazonaws.com&region=us-east-1"
  #   # segmentStore: "s3://my-streams-bucket?endpoint=https://s3.us-east-1.amazonaws.com&region=us-east-1"
  #   credentialsSecretName: example-s3-credentials
  #   allowInsecureHttp: false
  #   egressCidrs: ["0.0.0.0/0"]
  # Non-S3 backup/segment stores (S-07b) — mutually exclusive with the
  # matching field under `s3:` above. `backupStore` accepts `cluster` (the
  # default, spelled out) or `fs:<path>`; `segmentStore` accepts only
  # `dir:<path>` (--segment-store has no `cluster` keyword). Either path
  # must live under the pod's own data volume (/var/lib/animus by default)
  # to persist.
  # backupStore: "fs:/var/lib/animus/backups"
  # segmentStore: "dir:/var/lib/animus/segments"
  # Encryption at rest (ADR 0069, S-03 PR 3). Names a pre-existing Secret
  # (same namespace) holding the raw 64-hex-character AEAD key under the
  # single well-known data key "key" — generate one with:
  #   openssl rand -hex 32 | kubectl create secret generic example-encryption-key \
  #     --from-file=key=/dev/stdin
  # This operator never generates, inspects, or stores the key itself, only
  # mounts the named Secret read-only. No key rotation in v1: changing the
  # Secret's own content under an unchanged name never rolls a pod.
  # encryptionKeySecretName: example-encryption-key
