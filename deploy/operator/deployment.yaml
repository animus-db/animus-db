apiVersion: v1
kind: Namespace
metadata:
  name: animus-operator
  labels:
    app.kubernetes.io/name: animus-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: animus-operator
  namespace: animus-operator
  labels:
    app.kubernetes.io/name: animus-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: animus-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: animus-operator
    spec:
      serviceAccountName: animus-operator
      containers:
        - name: animus-operator
          # The operator's own container image build is a follow-up (this
          # PR ships the controller binary and manifests only) — this
          # placeholder tag is what the eventual image-build change fills
          # in.
          image: ghcr.io/animus-db/animus-operator:latest
          args: ["run"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
