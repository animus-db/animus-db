# cargo-deny configuration. Run with: cargo deny check
#
# Gates licenses and security advisories in CI (see .github/workflows/ci.yml).

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# AnimusDB is AGPL-3.0 (see docs/adr/0007). The project's own crates carry that
# license, so it must be allowed; third-party dependencies must carry permissive
# licenses compatible with AGPL redistribution.
allow = [
    # AnimusDB's own workspace crates.
    "AGPL-3.0-only",
    # Permissive third-party licenses.
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # `animus-operator`'s `kube` dependency (rustls-tls) pulls
    # `rustls-platform-verifier` -> `webpki-root-certs`, a bundled root-CA
    # data crate under the Community Data License Agreement, Permissive
    # variant, v2.0 — a permissive, non-copyleft data license (comparable to
    # CC0/MIT in the freedoms it grants), fine to redistribute under AGPL.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
