name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin to the workspace rust-version (Cargo.toml [workspace.package]).
      - name: Install Rust toolchain (1.96)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # The five required gates (see CLAUDE.md "Commands"), each a separate,
      # clearly-named step so a failure points straight at the offending gate.
      - name: rustfmt (cargo fmt --all --check)
        run: cargo fmt --all --check

      - name: clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: build (--workspace --all-targets)
        run: cargo build --workspace --all-targets

      - name: test (--workspace)
        run: cargo test --workspace

      # cargo-deny can't run in the local dev sandbox (not installed); CI is
      # where this gate actually executes. The pinned action installs cargo-deny
      # and runs `cargo deny check` (advisories + bans + licenses + sources).
      - name: cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
