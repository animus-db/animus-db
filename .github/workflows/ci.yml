name: CI

# A branch under review already gets a `pull_request` run, so `push` is scoped
# to `main`. Left unscoped, every push to a PR branch in this repo fired both
# events on the same commit and ran `gates` + `prod-liveness` twice for
# identical results — a straight doubling of shared-runner time. Post-merge
# `main` pushes keep their run: that is what the README's CI badge reports,
# and it is the only signal for a commit that reaches `main` without a PR.
# A branch pushed with no PR open now gets no CI until the PR exists.
# `merge_group` runs the same jobs on the merge queue's temporary commit (the
# PR merged onto the latest `main`), so the queue's required checks (`gates`,
# `prod-liveness`) report on exactly what will land. Without it a required
# check never starts for a queued PR and the entry times out.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# At most one in-flight CI run per branch. A `pull_request` event's
# `github.ref` is that PR's own `refs/pull/N/merge`, so this keys per-PR
# without needing the PR number.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled — only the newest head is worth a
  # verdict. `main` pushes are never cancelled: each merged commit gets its
  # own run, and the group merely serialises them instead of overlapping.
  # A `merge_group` run's ref is its own `gh-readonly-queue/...` branch, one
  # per queue entry, and the queue itself cancels entries it drops.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # No incremental compilation (every job builds from a fresh checkout, so
  # incremental's bookkeeping is pure overhead here) and no debug info. A
  # local clean `cargo build --workspace --all-targets` measured 2.5 min
  # without debuginfo vs. 4.5 min under CI's prior default (full debuginfo)
  # — most of the `gates` job's ~5.7 min of compile time. Panics/backtraces
  # stay useful without debuginfo: `RUST_BACKTRACE=1` still resolves symbol
  # names, it just can't attach source line numbers to them.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # The hard, single-attempt, per-push gate: deterministic SimEnv suites only.
  # Real-thread ProdEnv tests are excluded (see `prod-liveness` below) — they
  # need dedicated cores that this 2-vCPU shared runner can't give a job also
  # building/testing the rest of the workspace, and were starving here one
  # distinct victim per run (issues #280/#286).
  #
  # `gates` is a thin aggregate over four parallel jobs (`lint`,
  # `test-archive` -> `test-shard`, `test-doc`), the same shape as
  # `prod-liveness` below, for the same reason: branch protection names one
  # required check, "gates", and that name has to keep resolving to a single
  # job. Before this split `gates` was one serial job (fmt, clippy, build,
  # `cargo test`, `--lib`, deny); its test phase now runs sharded under
  # cargo-nextest and every compile job shares an sccache compile cache.
  gates:
    name: gates
    needs: [lint, test-shard, test-doc]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check gate results
        run: |
          lint="${{ needs.lint.result }}"
          shards="${{ needs.test-shard.result }}"
          doc="${{ needs.test-doc.result }}"
          echo "lint (fmt, fixtures, clippy, build, deny): ${lint}"
          echo "test-shard (all shards): ${shards}"
          echo "test-doc: ${doc}"
          if [ "${lint}" != "success" ] || [ "${shards}" != "success" ] || [ "${doc}" != "success" ]; then
            echo "::error::one or more gates jobs failed"
            exit 1
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    env:
      # sccache (see the step below) wraps every rustc invocation; it needs
      # CARGO_INCREMENTAL=0, which the workflow-level env already sets.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      # Full history (not the default shallow depth-1 clone): the format-
      # fixtures guard step below needs `git merge-base HEAD origin/main` to
      # resolve, which a shallow clone's missing history would silently
      # defeat back to a no-op skip rather than an enforced check. Same
      # fix `dco.yml` already applies for the same `merge-base` need.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # `cargo build --workspace --all-targets` (every crate x every test/bench
      # binary) plus the restored cargo cache no longer fit in the ~14 GB free
      # on a stock ubuntu-latest runner. Clear preinstalled toolchains this job
      # never uses (.NET, Android SDK, GHC, CodeQL bundles) before doing
      # anything else, so there's headroom before the cache is even restored.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          df -h /

      # Pin to the workspace rust-version (Cargo.toml [workspace.package]).
      - name: Install Rust toolchain (1.96)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      # Compile cache for every compile-heavy job in this file. Registry/git
      # deps stay with Swatinem/rust-cache below; the compiled artifacts go
      # through sccache's GitHub Actions cache backend instead of caching
      # `target/` (see the comment on the rust-cache step for why `target/`
      # itself stays uncached: a multi-GB dir whose upload/restore can cost
      # more than the compile it saves, and which eats the shared 10 GB
      # cache budget). sccache caches per-crate rustc outputs, so only the
      # crates a diff actually touches (plus their dependents) recompile, and
      # sibling jobs (`lint`, `test-archive`, `test-doc`, each
      # `prod-liveness-*` shard) reuse each other's dependency builds. Its
      # footprint is measured via the `sccache --show-stats` step at the end
      # of each job — read those before widening what it caches.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # `--all-targets` builds every test/bench binary in every crate, so this
      # job's target/ dir is much larger than corpus-deep's (which builds only
      # a few test binaries). Cache just the registry + git deps, not target/,
      # so cache restore doesn't itself eat the disk headroom freed above.
      #
      # Left at `cache-targets: "false"` deliberately, now that sccache is the
      # compile cache: caching `target/` too would store the same objects
      # twice. Flip it only if a CI measurement shows sccache alone
      # under-delivers.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      # The five required gates (see CLAUDE.md "Commands"), each a separate,
      # clearly-named step so a failure points straight at the offending gate.
      # (`test` is the `test-shard`/`test-doc` jobs below.)
      - name: rustfmt (cargo fmt --all --check)
        run: cargo fmt --all --check

      # ADR 0073 Phase 0: golden format fixtures under
      # `**/tests/fixtures/formats/**` are append-only — this fails the
      # build if any fixture already on `origin/main` was modified or
      # deleted (a new version file is always fine). Cheap (a git diff, no
      # compile), so it runs right after fmt, before the expensive gates.
      - name: format fixtures are append-only (ADR 0073)
        run: scripts/check-format-fixtures.sh

      # `--all-features` here (unlike the plain `cargo test` the test jobs run)
      # turns on every crate's opt-in `prod-heavy` feature too, so the
      # real-thread test binaries gated behind it (see `prod-liveness`) still
      # get type-checked on every push even though this job never runs them.
      - name: clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: build (--workspace --all-targets)
        run: cargo build --workspace --all-targets --locked

      # cargo-deny can't run in the local dev sandbox (not installed); CI is
      # where this gate actually executes. The pinned action installs cargo-deny
      # and runs `cargo deny check` (advisories + bans + licenses + sources).
      #
      # `RUSTC_WRAPPER` is blanked for this step only: the action runs cargo
      # inside its own Docker container, which inherits the job-level
      # `RUSTC_WRAPPER: sccache` but has no `sccache` binary, so `cargo
      # metadata` died with "could not execute process `sccache .../rustc -vV`
      # (never executed)". deny only resolves metadata; it compiles nothing.
      - name: cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        env:
          RUSTC_WRAPPER: ""
        with:
          command: check

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # Builds the gates' test binaries once, as a cargo-nextest archive, so the
  # `test-shard` jobs below only *run* tests (no repeated compile/link).
  #
  # Two archives, because one `cargo nextest archive` invocation cannot say
  # "every crate's tests, but only `animusd`'s `--lib`":
  #   * `gates-workspace.tar.zst` — `--workspace --exclude animusd`: every
  #     other crate's lib unit tests and integration tests. Cargo's plain
  #     `cargo test` (no `--features`) never turns on the opt-in `prod-heavy`
  #     feature, so the explicit `[[test]] required-features = ["prod-heavy"]`
  #     real-thread binaries are skipped structurally here exactly as they were
  #     under `cargo test` (they run in `prod-liveness-scattered`). The
  #     remaining real-thread-ish binaries (`lsm_clone_*`, one-per-file) stay
  #     separate targets for the same reason, not merged into the `it` binary.
  #   * `gates-animusd-lib.tar.zst` — `animusd`'s `--lib` sim tier (ADR 0061
  #     rung D3: dominated by deterministic `SimCluster` tests; a handful of
  #     single-node `ProdEnv` bring-ups ride along, as before). Its 100
  #     real-thread `tests/*.rs` binaries are `prod-liveness-animusd`'s.
  test-archive:
    name: test-archive
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          df -h /

      - name: Install Rust toolchain (1.96)
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # Pinned exact version, same as `prod-liveness-animusd`.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      - name: archive workspace tests (--exclude animusd)
        run: |
          cargo nextest archive --workspace --exclude animusd --locked \
            --archive-file gates-workspace.tar.zst
          cargo nextest archive -p animusd --lib --locked \
            --archive-file gates-animusd-lib.tar.zst
          ls -lh *.tar.zst

      # Already zstd-compressed, so no second compression pass.
      - name: Upload test archives
        uses: actions/upload-artifact@v4
        with:
          name: gates-test-archives
          path: |
            gates-workspace.tar.zst
            gates-animusd-lib.tar.zst
          compression-level: 0
          retention-days: 1

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # The gates' test execution, sharded 4 ways by test count
  # (`--partition count:N/4`) over the archives `test-archive` built. Replaces
  # the old single `cargo test --workspace --exclude animusd --
  # --test-threads=2` + `cargo test -p animusd --lib -- --test-threads=2`
  # steps. Same scope: every test those two commands ran still runs per push
  # (doc tests, which nextest does not run, are `test-doc` below).
  #
  # `--profile gates` (.config/nextest.toml) pins test-threads=2 — the same
  # in-runner parallelism the old steps used, matching these runners' 2 vCPUs
  # so heavyweight multi-node cluster tests don't oversubscribe them (issue
  # #278 items 2/9) — and fail-fast=false, retries=0. A flaky test is a bug in
  # this repo, never a retry (CLAUDE.md, Session operating mode item 4): there
  # is no retry here and no terminating timeout. nextest runs each test in its
  # own process, strictly more isolation than `cargo test`'s shared-process
  # default.
  test-shard:
    name: test-shard (${{ matrix.partition }}/4)
    needs: test-archive
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      # The tests read checked-in fixtures relative to `CARGO_MANIFEST_DIR`,
      # so the archive is run against a real checkout at the same path it
      # was built from.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (1.96)
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143

      - name: Download test archives
        uses: actions/download-artifact@v4
        with:
          name: gates-test-archives

      - name: test workspace shard ${{ matrix.partition }}/4 (--exclude animusd)
        run: |
          cargo nextest run --archive-file gates-workspace.tar.zst \
            --workspace-remap . \
            --partition count:${{ matrix.partition }}/4 \
            --profile gates

      - name: test animusd sim tier shard ${{ matrix.partition }}/4 (--lib)
        run: |
          cargo nextest run --archive-file gates-animusd-lib.tar.zst \
            --workspace-remap . \
            --partition count:${{ matrix.partition }}/4 \
            --profile gates

  # nextest does not run doc tests, so they keep their own `cargo test --doc`
  # job with the same scope the old `cargo test --workspace --exclude
  # animusd` had (animusd's lib has no doctests that the old `--lib` step ran).
  test-doc:
    name: test-doc
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          df -h /

      - name: Install Rust toolchain (1.96)
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      - name: doc tests (--workspace --exclude animusd)
        run: cargo test --workspace --exclude animusd --doc --locked -- --test-threads=2

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # The real-thread ProdEnv tier (issues #280/#286), sharded.
  #
  # Real-thread liveness/concurrency properties (election timing, group
  # commit, lock-free races) can only be observed over genuine OS threads —
  # SimEnv proves logic and ordering, not real-thread liveness (see
  # CLAUDE.md's Testing section). On this repo's 2-vCPU shared runners those
  # tests' timing/convergence budgets are contended by everything else on the
  # box, but a first-attempt failure here is red exactly like `gates` — no
  # retry. This tier used to give itself a 2-attempt retry loop as a
  # stopgap for runner-class contention; it silently absorbed 3 real flakes
  # in 7 runs before anyone noticed (issues #555, #559, #561, all fixed on
  # `main`; see docs/engineering-lessons.md's 2026-09-02 Testing entry). A
  # retry that reruns a whole test binary can't tell "genuine timing
  # starvation" from "a real bug that happens not to reproduce every time" —
  # it just hides the difference, which is exactly what CLAUDE.md's item 4
  # ("a flaky test is a real bug, full stop") rules out. The sharding below
  # is the actual fix for contention (give each real-thread test a runner
  # with nothing else on its 2 vCPUs), not a retry sitting on top of it.
  #
  # This tier used to be one job running everything (111 binaries, 507
  # tests) at `--test-threads=1`, ~18 min of serial test time alone — the
  # pre-sharding baseline, 2026-09-02, kept here only as historical
  # context; see below for the current (post-D3) numbers. Three worker jobs
  # below split that across parallel runners, each still single-threaded
  # *within itself* — the whole reason this tier exists is to give each
  # real-thread test a runner with nothing else contending for its 2
  # vCPUs, so intra-runner parallelism stays off, only the runner count
  # goes up. `prod-liveness` at the bottom is a thin aggregate: GitHub
  # branch protection names one required check, "prod-liveness", and that
  # name has to keep resolving to a single job even though the work behind
  # it is now split across six runners.
  #
  # `animusd`'s real-thread `tests/*.rs` integration binaries run under
  # cargo-nextest instead of `cargo test`, partitioned 4 ways by test count
  # (`--partition count:N/4`) — nextest is what makes an even,
  # test-granularity split possible; `cargo test` can only be split by
  # binary, and animusd's binaries are not remotely equal-sized. nextest
  # already runs every test in its own process (stricter isolation than
  # `cargo test`'s "many tests share one process" default), so this is a
  # superset of the isolation the old single job had, not a reduction of it.
  # `--lib` no longer runs in this tier at all — see `gates`'s own step for
  # where it moved and why (ADR 0061 rung D3's closing PR, 2026-09-07).
  #
  # **ADR 0061 rung D3 (closed 2026-09-07) shrank this tier's own binary
  # and test count**: `crates/animusd/tests/*.rs` went from 120 files/521
  # tests to 100 files/418 tests as base-table logic, DDL, and GSI/LSI
  # query/scan coverage converted to the deterministic `SimCluster` tier
  # instead (`gates`'s own `--lib` step above; also docs/roadmap.md's C-04
  # entry and docs/adr/0061-*.md's matching amendment). Measured effect on
  # this tier's own shard wall time: the slowest of the four
  # `prod-liveness-animusd` shards went from 598s (run 34103555943,
  # pre-D3) to 564s (run 34123273726, at D3 PR 3a) — per-shard spread
  # 231-303s. Each shard rebuilds `-p animusd` from a cold cache
  # (`cache-targets: false`), so a compile floor of roughly five minutes
  # sits under every shard regardless of test count; shrinking the test
  # count only trims the execution portion sitting on top of that floor.
  # **The partition count deliberately stays at 4**: going to 3 or 2
  # partitions would concentrate more execution time (and, before this PR,
  # more compile time too) onto each remaining shard while the fixed
  # per-shard compile floor stays exactly as fixed — it would RAISE the
  # max shard time, not lower it. (These two measurements were taken with
  # each shard still building `--lib --tests`, before this PR dropped
  # `--lib` from the shards below — that only shrinks each shard's own
  # build further, reinforcing "don't reduce partitions" rather than
  # undermining it; the post-drop number has not been separately
  # re-measured.)
  prod-liveness-animusd:
    name: prod-liveness-animusd (${{ matrix.partition }}/4)
    strategy:
      # One shard failing must not cancel the other three — each names its
      # own failures independently, same spirit as `gates` reporting each
      # gate on its own step.
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          df -h /

      - name: Install Rust toolchain (1.96)
        uses: dtolnay/rust-toolchain@1.96.0

      # Compile cache — see the `lint` job's `Set up sccache` step.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # Pinned exact version, per this repo's own convention for every other
      # third-party tool in these workflows (the Rust toolchain, cargo-deny).
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      # All of `animusd`'s real-thread `tests/*.rs` integration binaries —
      # 100 of them as of ADR 0061 rung D3's 2026-09-07 close (120 pre-D3;
      # see this job group's own comment above) — MINUS the two
      # `orphan_an_lsi_row` hammer tests (see `prod-liveness-hammer-pair`
      # below for why those run elsewhere). **No longer `--lib` too**: that
      # target is now dominated by deterministic `SimCluster` sim tests and
      # runs inside `gates` instead (a handful of pre-existing real-thread
      # `#[cfg(test)] mod`s inside `--lib` moved there along with it — see
      # `gates`'s own step comment for the list and the trade-off). `--profile
      # ci` (from .config/nextest.toml) pins test-threads=1 and
      # fail-fast=false; see that file for why. `count:${{ matrix.partition
      # }}/4` is nextest's own test-count-balanced partitioning — not a
      # hand-maintained list of which binaries go in which shard, so it
      # stays balanced as tests are added or removed; dropping `--lib` from
      # the pool being partitioned doesn't change that — nextest computes
      # the balance fresh from whatever targets are named on the command
      # line. Single attempt — see this job group's own comment above for
      # why there is no retry.
      - name: test animusd shard ${{ matrix.partition }}/4 (--tests)
        run: |
          cargo nextest run -p animusd --tests --locked \
            -E 'not test(orphan_an_lsi_row)' \
            --partition count:${{ matrix.partition }}/4 \
            --profile ci

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # `dynamo_index_writes.rs`'s two cross-node "hammer" tests
  # (`cross_node_racing_unconditional_puts_never_orphan_an_lsi_row` and
  # `cross_node_racing_transactional_and_plain_puts_never_orphan_an_lsi_row`)
  # share a process-local `static HAMMER_SERIAL: OnceLock<Mutex<()>>` whose
  # own doc comment says why: each saturates a 3-node cluster with
  # deliberately-contended writes, and if both run at once they starve each
  # other to near-zero committed writes. That mutex only ever serialized
  # them against Rust's default same-process test parallelism — it did
  # nothing in the OLD single-job `prod-liveness` (already `--test-threads=1`,
  # so the whole tier ran one test at a time on one runner) and it does
  # nothing under nextest either, which gives every test its own process
  # regardless of thread count, so two processes never contend for the same
  # static. What actually changed is sharding: nextest's test-count
  # partitioning has no reason to keep these two together, and if it splits
  # them across two of the four `prod-liveness-animusd` shards, they run on
  # two *different* runners at the same wall-clock time — exactly the
  # starvation the mutex exists to prevent, now with no mutex able to stop
  # it. Excluded from the sharded run above (`-E 'not
  # test(orphan_an_lsi_row)'`) and run together here instead, on one runner,
  # `--test-threads=1`, so they stay exactly as serialized as they were
  # before sharding — plain `cargo test`, not nextest: the point of this job
  # is one runner running two tests one after another, which needs no
  # partitioning at all.
  prod-liveness-hammer-pair:
    name: prod-liveness-hammer-pair
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          df -h /

      - name: Install Rust toolchain (1.96)
        uses: dtolnay/rust-toolchain@1.96.0

      # Compile cache — see the `lint` job's `Set up sccache` step.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      - name: test animusd LSI-orphan hammer pair
        run: |
          cargo test -p animusd --test dynamo_index_writes --locked \
            -- --test-threads=1 orphan_an_lsi_row

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # The 5 scattered real-thread binaries outside animusd, each gated behind
  # its crate's opt-in `prod-heavy` feature (see `gates`'s test step
  # comment). Small enough on its own (observed 64-86 s serial as of ADR
  # 0061 rung D3's 2026-09-07 close — the "~1080 s for all of animusd"
  # this comment used to cite is the stale pre-sharding baseline, from
  # before `prod-liveness-animusd` existed as parallel shards at all) that
  # splitting it further would not shorten this tier's wall time — it just
  # needs to not land stacked on top of one of the four
  # `prod-liveness-animusd` shards, and running as its own parallel job
  # already achieves that. Left on plain `cargo test`, unchanged from
  # before: nextest earns its keep on animusd's own uneven pile of 100
  # real-thread `tests/*.rs` binaries, not on 5 already-comparable ones.
  prod-liveness-scattered:
    name: prod-liveness-scattered
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          df -h /

      - name: Install Rust toolchain (1.96)
        uses: dtolnay/rust-toolchain@1.96.0

      # Compile cache — see the `lint` job's `Set up sccache` step.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      - name: test scattered prod-heavy binaries
        run: |
          cargo test -p animus-control --features prod-heavy --locked \
            --test prod_liveness --test control_membership_prod \
            -- --test-threads=1
          cargo test -p animus-cp-data --features prod-heavy --locked \
            --test prod_concurrent_ts_monotonic \
            --test prod_compaction_persist_round \
            -- --test-threads=1
          cargo test -p animus-storage --features prod-heavy --locked \
            --test lsm_concurrent --test idle_engine_cost \
            -- --test-threads=1
          # B-01's smoke: a real 3-node in-process ProdEnv cluster driven
          # over the SigV4 DynamoDB wire (~45 s). Real threads + a whole
          # cluster => same contention rules as the binaries above.
          cargo test -p animus-bench --features prod-heavy --locked \
            --test smoke -- --test-threads=1

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # The required-check aggregate: branch protection names "prod-liveness" as
  # a single required status, so this job exists purely to keep that name
  # resolving to one check while the actual work runs as the six jobs above
  # (four animusd shards + the hammer pair + scattered). `if: always()` is
  # required — without it, this job is skipped (not failed) the moment any
  # dependency fails, per GitHub Actions' default `needs` propagation, which
  # would make a real failure here look like "check didn't run" rather than
  # "check failed". `needs.<job>.result` on a matrixed job
  # (`prod-liveness-animusd`) is success only if every partition in the
  # matrix succeeded, so this single comparison already covers all four
  # shards.
  prod-liveness:
    name: prod-liveness
    needs:
      [
        prod-liveness-animusd,
        prod-liveness-hammer-pair,
        prod-liveness-scattered,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check shard results
        run: |
          animusd="${{ needs.prod-liveness-animusd.result }}"
          hammer_pair="${{ needs.prod-liveness-hammer-pair.result }}"
          scattered="${{ needs.prod-liveness-scattered.result }}"
          echo "prod-liveness-animusd (all 4 shards): ${animusd}"
          echo "prod-liveness-hammer-pair: ${hammer_pair}"
          echo "prod-liveness-scattered: ${scattered}"
          if [ "${animusd}" != "success" ] || [ "${hammer_pair}" != "success" ] || [ "${scattered}" != "success" ]; then
            echo "::error::one or more prod-liveness shards failed"
            exit 1
          fi

  # Real S3-compatible endpoint round trips (roadmap S-08 M4). The two
  # env-gated tests below SKIP (and pass) when `ANIMUS_S3_TEST_ENDPOINT` is
  # unset, so a job that merely invokes them proves nothing — this job sets
  # `ANIMUS_S3_REQUIRE_ENDPOINT=1`, which turns a missing endpoint into a
  # panic. The server is RustFS (the same pinned image and settings as
  # `scripts/e2e-kind.sh`; MinIO images stopped resolving, issue #863), and
  # the bucket is created with the same pinned aws-cli image. Credentials
  # are throwaway, for this one ephemeral container only. Not part of the
  # `gates`/`prod-liveness` aggregates.
  s3-real-endpoint:
    name: s3-real-endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFS_IMAGE: rustfs/rustfs:1.0.0-rc.6
      AWSCLI_IMAGE: amazon/aws-cli:2.36.44
      S3_ACCESS_KEY: ciaccesskey
      S3_SECRET_KEY: cisecretkey123
      S3_BUCKET: ci-real-endpoint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (1.96)
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Start RustFS
        run: |
          data_dir="$(mktemp -d)"
          # The container runs as uid 10001; its data dir must be writable.
          sudo chown 10001:10001 "$data_dir"
          docker run -d --name rustfs --network host \
            -v "$data_dir:/data" \
            -e RUSTFS_VOLUMES=/data \
            -e RUSTFS_ADDRESS=0.0.0.0:9000 \
            -e RUSTFS_ACCESS_KEY="$S3_ACCESS_KEY" \
            -e RUSTFS_SECRET_KEY="$S3_SECRET_KEY" \
            "$RUSTFS_IMAGE"
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "::error::RustFS did not become healthy within 120s"
            docker logs rustfs || true
            exit 1
          fi

      - name: Create bucket
        run: |
          docker run --rm --network host \
            -e AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY" \
            -e AWS_SECRET_ACCESS_KEY="$S3_SECRET_KEY" \
            -e AWS_DEFAULT_REGION=us-east-1 \
            "$AWSCLI_IMAGE" \
            --endpoint-url http://127.0.0.1:9000 s3 mb "s3://$S3_BUCKET"

      - name: Run real-endpoint tests
        env:
          ANIMUS_S3_REQUIRE_ENDPOINT: "1"
          ANIMUS_S3_TEST_ENDPOINT: http://127.0.0.1:9000
          ANIMUS_S3_TEST_BUCKET: ${{ env.S3_BUCKET }}
          ANIMUS_S3_TEST_ACCESS_KEY_ID: ${{ env.S3_ACCESS_KEY }}
          ANIMUS_S3_TEST_SECRET_ACCESS_KEY: ${{ env.S3_SECRET_KEY }}
        run: |
          cargo test -p animus-s3 --features prod --locked \
            --test minio_real_endpoint -- --nocapture
          cargo test -p animus-env --features prod --locked \
            --test s3_segment_store_minio -- --nocapture
          # The rest of both crates' `prod`-gated targets (the real-socket
          # `transport_timeout` test, `s3_store`'s `#[tokio::test]` unit
          # tests), so their coverage never hinges on workspace feature
          # unification in the sharded gates.
          cargo test -p animus-s3 --features prod --locked
          cargo test -p animus-env --features prod --locked --lib s3_store

      - name: RustFS logs
        if: failure()
        run: docker logs rustfs || true
