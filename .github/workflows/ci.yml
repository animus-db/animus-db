name: CI

# A branch under review already gets a `pull_request` run, so `push` is scoped
# to `main`. Left unscoped, every push to a PR branch in this repo fired both
# events on the same commit and ran `gates` + `prod-liveness` twice for
# identical results — a straight doubling of shared-runner time. Post-merge
# `main` pushes keep their run: that is what the README's CI badge reports,
# and it is the only signal for a commit that reaches `main` without a PR.
# A branch pushed with no PR open now gets no CI until the PR exists.
on:
  push:
    branches: [main]
  pull_request:

# At most one in-flight CI run per branch. A `pull_request` event's
# `github.ref` is that PR's own `refs/pull/N/merge`, so this keys per-PR
# without needing the PR number.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled — only the newest head is worth a
  # verdict. `main` pushes are never cancelled: each merged commit gets its
  # own run, and the group merely serialises them instead of overlapping.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # No incremental compilation (every job builds from a fresh checkout, so
  # incremental's bookkeeping is pure overhead here) and no debug info. A
  # local clean `cargo build --workspace --all-targets` measured 2.5 min
  # without debuginfo vs. 4.5 min under CI's prior default (full debuginfo)
  # — most of the `gates` job's ~5.7 min of compile time. Panics/backtraces
  # stay useful without debuginfo: `RUST_BACKTRACE=1` still resolves symbol
  # names, it just can't attach source line numbers to them.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # The hard, single-attempt, per-push gate: deterministic SimEnv suites only.
  # Real-thread ProdEnv tests are excluded (see `prod-liveness` below) — they
  # need dedicated cores that this 2-vCPU shared runner can't give a job also
  # building/testing the rest of the workspace, and were starving here one
  # distinct victim per run (issues #280/#286).
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `cargo build --workspace --all-targets` (every crate x every test/bench
      # binary) plus the restored cargo cache no longer fit in the ~14 GB free
      # on a stock ubuntu-latest runner. Clear preinstalled toolchains this job
      # never uses (.NET, Android SDK, GHC, CodeQL bundles) before doing
      # anything else, so there's headroom before the cache is even restored.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          df -h /

      # Pin to the workspace rust-version (Cargo.toml [workspace.package]).
      - name: Install Rust toolchain (1.96)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      # `--all-targets` builds every test/bench binary in every crate, so this
      # job's target/ dir is much larger than corpus-deep's (which builds only
      # 4 test binaries). Cache just the registry + git deps, not target/, so
      # cache restore doesn't itself eat the disk headroom freed above.
      #
      # Left at `cache-targets: "false"` even now that CARGO_PROFILE_DEV_DEBUG=0
      # shrinks the target dir: no CI measurement yet shows it now fits the
      # cache usefully (upload/restore of a still-multi-GB dir can cost more
      # than the compile time it would save, and it eats into this repo's
      # shared 10 GB cache budget). Flip it only once a CI run's actual
      # target/ size after this change justifies it — not as a side effect of
      # this diff.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      # The five required gates (see CLAUDE.md "Commands"), each a separate,
      # clearly-named step so a failure points straight at the offending gate.
      - name: rustfmt (cargo fmt --all --check)
        run: cargo fmt --all --check

      # `--all-features` here (unlike the plain `cargo test` below) turns on
      # every crate's opt-in `prod-heavy` feature too, so the real-thread test
      # binaries gated behind it (see `prod-liveness`) still get type-checked
      # on every push even though this job never runs them.
      - name: clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: build (--workspace --all-targets)
        run: cargo build --workspace --all-targets

      # Hosted runners give this job 2 cores, but the default test-threads
      # (= logical CPUs) lets cargo test run many heavyweight multi-node
      # ProdEnv cluster tests concurrently, oversubscribing those 2 cores and
      # blowing the suite's timing/convergence budgets under contention
      # (issue #278 items 2/9 and the budget-class flakes it catalogs).
      # Bound in-binary test parallelism to match the cores while keeping
      # some overlap; if wall-time grows too much the alternative is a
      # larger (more-core) self-hosted runner rather than raising this back.
      #
      # `--exclude animusd` drops that crate's 66 real-thread integration
      # binaries plus its real-thread `--lib` tests (`prod-liveness` below
      # covers all of it instead). The other 5 scattered real-thread
      # binaries (`animus-control`/`animus-cp-data`/`animus-storage`) are
      # excluded structurally, not by name here: each
      # is declared as an explicit `[[test]] required-features =
      # ["prod-heavy"]` target in its crate's Cargo.toml, and this plain
      # `cargo test` (no `--features`) never turns that feature on, so Cargo
      # skips building/running them. That makes the split compile-visible
      # instead of a hand-maintained exclude list that silently drifts as
      # tests are added (see docs/engineering-lessons.md).
      - name: test (--workspace --exclude animusd)
        run: cargo test --workspace --exclude animusd -- --test-threads=2

      # cargo-deny can't run in the local dev sandbox (not installed); CI is
      # where this gate actually executes. The pinned action installs cargo-deny
      # and runs `cargo deny check` (advisories + bans + licenses + sources).
      - name: cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # The retried real-thread ProdEnv tier (issues #280/#286), sharded.
  #
  # Real-thread liveness/concurrency properties (election timing, group
  # commit, lock-free races) can only be observed over genuine OS threads —
  # SimEnv proves logic and ordering, not real-thread liveness (see
  # CLAUDE.md's Testing section). On this repo's 2-vCPU shared runners those
  # tests' timing/convergence budgets are contended by everything else on the
  # box, so a bounded retry (2 attempts) is a stopgap for runner-class
  # starvation, not a license to ignore failures: the house doctrine still
  # applies — "a flaky ProdEnv integration test is a real bug", not a
  # determinism hole. A test that fails BOTH attempts blocks merge exactly
  # like `gates`; the retry only absorbs transient contention, never a
  # reproducible failure.
  #
  # This tier used to be one job running everything (111 binaries, 507
  # tests) at `--test-threads=1`, ~18 min of serial test time alone. Three
  # worker jobs below split that across parallel runners, each still
  # single-threaded *within itself* — the whole reason this tier exists is
  # to give each real-thread test a runner with nothing else contending for
  # its 2 vCPUs, so intra-runner parallelism stays off, only the runner
  # count goes up. `prod-liveness` at the bottom is a thin aggregate: GitHub
  # branch protection names one required check, "prod-liveness", and that
  # name has to keep resolving to a single job even though the work behind
  # it is now split across six runners.
  #
  # `animusd`'s 66 real-thread integration binaries + its real-thread `--lib`
  # tests run under cargo-nextest instead of `cargo test`, partitioned 4 ways
  # by test count (`--partition count:N/4`) — nextest is what makes an even,
  # test-granularity split possible; `cargo test` can only be split by
  # binary, and animusd's binaries are not remotely equal-sized. nextest
  # already runs every test in its own process (stricter isolation than
  # `cargo test`'s "many tests share one process" default), so this is a
  # superset of the isolation the old single job had, not a reduction of it.
  prod-liveness-animusd:
    name: prod-liveness-animusd (${{ matrix.partition }}/4)
    strategy:
      # One shard failing must not cancel the other three — each names its
      # own failures independently, same spirit as `gates` reporting each
      # gate on its own step.
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          df -h /

      - name: Install Rust toolchain (1.96)
        uses: dtolnay/rust-toolchain@1.96.0

      # Pinned exact version, per this repo's own convention for every other
      # third-party tool in these workflows (the Rust toolchain, cargo-deny).
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      # All of `animusd`: 66 real-thread integration test binaries plus its
      # `--lib` tests (confirm_futility_tests, dynamo.rs, index_drain.rs,
      # halted_shutdown_tests are real-thread too), MINUS the two
      # `orphan_an_lsi_row` hammer tests (see `prod-liveness-hammer-pair`
      # below for why those run elsewhere). `--profile ci` (from
      # .config/nextest.toml) pins test-threads=1 and fail-fast=false; see
      # that file for why. `count:${{ matrix.partition }}/4` is nextest's
      # own test-count-balanced partitioning — not a hand-maintained list of
      # which binaries go in which shard, so it stays balanced as tests are
      # added or removed.
      - name: test animusd shard ${{ matrix.partition }}/4 (--lib --tests, 2 attempts)
        run: |
          for attempt in 1 2; do
            if cargo nextest run -p animusd --lib --tests \
                 -E 'not test(orphan_an_lsi_row)' \
                 --partition count:${{ matrix.partition }}/4 \
                 --profile ci; then
              exit 0
            fi
            echo "::warning::animusd prod-liveness shard ${{ matrix.partition }}/4 failed on attempt ${attempt}/2"
          done
          exit 1

  # `dynamo_index_writes.rs`'s two cross-node "hammer" tests
  # (`cross_node_racing_unconditional_puts_never_orphan_an_lsi_row` and
  # `cross_node_racing_transactional_and_plain_puts_never_orphan_an_lsi_row`)
  # share a process-local `static HAMMER_SERIAL: OnceLock<Mutex<()>>` whose
  # own doc comment says why: each saturates a 3-node cluster with
  # deliberately-contended writes, and if both run at once they starve each
  # other to near-zero committed writes. That mutex only ever serialized
  # them against Rust's default same-process test parallelism — it did
  # nothing in the OLD single-job `prod-liveness` (already `--test-threads=1`,
  # so the whole tier ran one test at a time on one runner) and it does
  # nothing under nextest either, which gives every test its own process
  # regardless of thread count, so two processes never contend for the same
  # static. What actually changed is sharding: nextest's test-count
  # partitioning has no reason to keep these two together, and if it splits
  # them across two of the four `prod-liveness-animusd` shards, they run on
  # two *different* runners at the same wall-clock time — exactly the
  # starvation the mutex exists to prevent, now with no mutex able to stop
  # it. Excluded from the sharded run above (`-E 'not
  # test(orphan_an_lsi_row)'`) and run together here instead, on one runner,
  # `--test-threads=1`, so they stay exactly as serialized as they were
  # before sharding — plain `cargo test`, not nextest: the point of this job
  # is one runner running two tests one after another, which needs no
  # partitioning at all.
  prod-liveness-hammer-pair:
    name: prod-liveness-hammer-pair
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          df -h /

      - name: Install Rust toolchain (1.96)
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      - name: test animusd LSI-orphan hammer pair (2 attempts)
        run: |
          for attempt in 1 2; do
            if cargo test -p animusd --test dynamo_index_writes \
                 -- --test-threads=1 orphan_an_lsi_row; then
              exit 0
            fi
            echo "::warning::animusd hammer-pair tests failed on attempt ${attempt}/2"
          done
          exit 1

  # The 5 scattered real-thread binaries outside animusd, each gated behind
  # its crate's opt-in `prod-heavy` feature (see `gates`'s test step
  # comment). Small enough on its own (~35-50 s serial, vs. ~1080 s for all
  # of animusd) that splitting it further would not shorten this tier's
  # wall time — it just needs to not land stacked on top of one of the four
  # `prod-liveness-animusd` shards, and running as its own parallel job
  # already achieves that. Left on plain `cargo test`, unchanged from
  # before: nextest earns its keep on animusd's uneven pile of 66+ binaries,
  # not on 5 already-comparable ones.
  prod-liveness-scattered:
    name: prod-liveness-scattered
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          df -h /

      - name: Install Rust toolchain (1.96)
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      - name: test scattered prod-heavy binaries (2 attempts)
        run: |
          for attempt in 1 2; do
            if cargo test -p animus-control --features prod-heavy \
                 --test prod_liveness --test control_membership_prod \
                 -- --test-threads=1 \
               && cargo test -p animus-cp-data --features prod-heavy \
                 --test prod_concurrent_ts_monotonic \
                 --test prod_compaction_persist_round \
                 -- --test-threads=1 \
               && cargo test -p animus-storage --features prod-heavy \
                 --test lsm_concurrent --test idle_engine_cost \
                 -- --test-threads=1; then
              exit 0
            fi
            echo "::warning::scattered prod-heavy tests failed on attempt ${attempt}/2"
          done
          exit 1

  # The required-check aggregate: branch protection names "prod-liveness" as
  # a single required status, so this job exists purely to keep that name
  # resolving to one check while the actual work runs as the six jobs above
  # (four animusd shards + the hammer pair + scattered). `if: always()` is
  # required — without it, this job is skipped (not failed) the moment any
  # dependency fails, per GitHub Actions' default `needs` propagation, which
  # would make a real failure here look like "check didn't run" rather than
  # "check failed". `needs.<job>.result` on a matrixed job
  # (`prod-liveness-animusd`) is success only if every partition in the
  # matrix succeeded, so this single comparison already covers all four
  # shards.
  prod-liveness:
    name: prod-liveness
    needs:
      [
        prod-liveness-animusd,
        prod-liveness-hammer-pair,
        prod-liveness-scattered,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check shard results
        run: |
          animusd="${{ needs.prod-liveness-animusd.result }}"
          hammer_pair="${{ needs.prod-liveness-hammer-pair.result }}"
          scattered="${{ needs.prod-liveness-scattered.result }}"
          echo "prod-liveness-animusd (all 4 shards): ${animusd}"
          echo "prod-liveness-hammer-pair: ${hammer_pair}"
          echo "prod-liveness-scattered: ${scattered}"
          if [ "${animusd}" != "success" ] || [ "${hammer_pair}" != "success" ] || [ "${scattered}" != "success" ]; then
            echo "::error::one or more prod-liveness shards failed"
            exit 1
          fi
