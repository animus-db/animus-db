name: image

# Builds the animusd and animus-operator container images on every push/PR
# that could affect them (both are stages of the same root Dockerfile, see
# its own header). A PR run only proves the images still build (no registry
# credentials are available to a `pull_request` event anyway); pushes to
# `main` and version tags additionally push to GHCR so `main` and tagged
# releases always have a corresponding image for both.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/image.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/image.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: build (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only needed to push; a `pull_request` run never reaches the push
      # step but the token is still scoped narrowly either way.
      packages: write
    strategy:
      # One image failing to build must not cancel the other.
      fail-fast: false
      matrix:
        include:
          # The default `runtime` stage — unchanged image/tag shape.
          - image: animus-db/animusd
            target: runtime
          # The `animus-operator` controller (ADR 0060 Part 3, S-07a) — the
          # `runtime-operator` stage of the same Dockerfile.
          - image: animus-db/animus-operator
            target: runtime-operator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # No credentials on `pull_request` (untrusted head, no secrets) — only
      # log in when this run might push.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` and the tag name only apply to push events; a PR build
      # tags nothing (push: false below).
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
