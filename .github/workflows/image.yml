name: image

# Builds the animusd and animus-operator container images on every push/PR
# that could affect them (both are stages of the same root Dockerfile, see
# its own header). A PR run only proves the images still build (no registry
# credentials are available to a `pull_request` event anyway); pushes to
# `main` and version tags additionally push to GHCR so `main` and tagged
# releases always have a corresponding image for both.
#
# Multi-arch, signed, attested (docs/release.md). Structure:
#   build - one leg per (image, platform). amd64 always; arm64 only on a `v*`
#           tag (a native arm runner, so no QEMU-emulated Rust compile), so
#           `main` pushes stay as cheap as before. Each pushed leg is pushed
#           *by digest* only; no tag points at a single-arch image.
#   merge - (push events only) joins the per-platform digests into one
#           manifest list carrying the tags below, then signs it by digest
#           with cosign (keyless), and attaches an SBOM attestation and a
#           SLSA build-provenance attestation.
# Path filters are not evaluated for tag pushes, so a `v*` tag always builds.
#
# The path filter below is deliberately narrower than "anything under
# `crates/`": the Dockerfile's builder stage runs `cargo build --release
# -p animusd -p animus-cli -p animus-operator`, so a change that cannot
# reach those three release binaries cannot change the images either, and
# building two images for it (two full release compiles on a shared
# runner) only lengthens the CI queue every other PR waits in. Excluded on
# that basis, each verifiable from the workspace itself:
#   - `crates/**/tests/**` and `crates/**/benches/**` — integration-test and
#     `[[bench]]` targets, never part of a `cargo build -p` of a bin/lib.
#   - `crates/animus-sim/**` and `crates/animus-test/**` — the deterministic
#     simulator and the corpus/model crates; both are `[dev-dependencies]`
#     of every crate that uses them (grep the workspace `Cargo.toml`s), so
#     they are absent from the release dependency graph.
#   - `crates/animusd/src/sim_cluster*.rs` — `animusd`'s `SimCluster`
#     fixture and its scenario modules, every one declared `#[cfg(test)]`
#     in `lib.rs` (ADR 0061), so `--release` never compiles them.
#   - `crates/*/CLAUDE.md` — per-crate agent guides, not compiled.
# A compile break confined to one of those paths is still caught, by the
# `gates` job's own `cargo build --workspace --all-targets`; this workflow
# only ever proved the *images* build, and none of these paths reach them.
# A `#[cfg(test)]` module living anywhere else under `src/` still triggers
# a build — the filter is by path, not by cfg, so it stays conservative.
# Both event blocks must list identical patterns (GitHub applies them per
# event and negations only take effect against an earlier positive match).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "!crates/**/tests/**"
      - "!crates/**/benches/**"
      - "!crates/animus-sim/**"
      - "!crates/animus-test/**"
      - "!crates/animusd/src/sim_cluster*.rs"
      - "!crates/*/CLAUDE.md"
      - ".github/workflows/image.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "!crates/**/tests/**"
      - "!crates/**/benches/**"
      - "!crates/animus-sim/**"
      - "!crates/animus-test/**"
      - "!crates/animusd/src/sim_cluster*.rs"
      - "!crates/*/CLAUDE.md"
      - ".github/workflows/image.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: build (${{ matrix.image }}, ${{ matrix.suffix }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      # Only needed to push; a `pull_request` run never reaches the push
      # step but the token is still scoped narrowly either way.
      packages: write
    strategy:
      # One image/platform failing to build must not cancel the others.
      fail-fast: false
      # amd64 always; arm64 added only for a `v*` tag push (see header).
      matrix: ${{ fromJSON(startsWith(github.ref, 'refs/tags/v') && '{"include":[{"image":"animus-db/animusd","target":"runtime","platform":"linux/amd64","suffix":"amd64","runner":"ubuntu-latest"},{"image":"animus-db/animusd","target":"runtime","platform":"linux/arm64","suffix":"arm64","runner":"ubuntu-24.04-arm"},{"image":"animus-db/animus-operator","target":"runtime-operator","platform":"linux/amd64","suffix":"amd64","runner":"ubuntu-latest"},{"image":"animus-db/animus-operator","target":"runtime-operator","platform":"linux/arm64","suffix":"arm64","runner":"ubuntu-24.04-arm"}]}' || '{"include":[{"image":"animus-db/animusd","target":"runtime","platform":"linux/amd64","suffix":"amd64","runner":"ubuntu-latest"},{"image":"animus-db/animus-operator","target":"runtime-operator","platform":"linux/amd64","suffix":"amd64","runner":"ubuntu-latest"}]}') }}
    steps:
      # `runtime` is the animusd node image (default Dockerfile target);
      # `runtime-operator` is the animus-operator controller (ADR 0060 Part
      # 3, S-07a).
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # No credentials on `pull_request` (untrusted head, no secrets) — only
      # log in when this run might push.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only used for the OCI labels here; the merge job computes the tags.
      - name: Compute image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}

      # Build into the local daemon first so the image can be started
      # before anything is published. The push step below is a cache hit
      # on the same layers, so this costs seconds, not a second build.
      - name: Build (load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          load: true
          tags: animus-smoke:${{ matrix.target }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.suffix }}

      # The binary must actually start inside its runtime stage. This is
      # what catches a builder/runtime glibc skew (a `rust:<ver>` builder
      # on a newer Debian than the `bookworm-slim` runtime): the loader
      # then fails with `version GLIBC_x.y not found` before main runs, so
      # a real usage line or CRD document on the output proves the binary
      # loaded and ran our code, whatever the exit status of the argument
      # used to get it there. The arm64 leg runs natively on an arm runner.
      - name: Smoke-start the image
        run: |
          set -euo pipefail
          # The argument's own exit status is irrelevant (`animusd --help`
          # is an unknown flag that prints the usage and exits non-zero),
          # so capture the output first instead of piping under pipefail.
          case "${{ matrix.target }}" in
            runtime)
              out="$(docker run --rm animus-smoke:runtime --help 2>&1 || true)"
              grep -q '^usage:' <<<"$out" \
                || { echo "animusd did not print its usage line:"; printf '%s\n' "$out" | head -5; exit 1; }
              ;;
            runtime-operator)
              out="$(docker run --rm animus-smoke:runtime-operator crd 2>&1 || true)"
              grep -q 'kind: CustomResourceDefinition' <<<"$out" \
                || { echo "animus-operator did not print its CRD:"; printf '%s\n' "$out" | head -5; exit 1; }
              ;;
          esac

      # Push by digest only; the manifest list (and every tag) is created
      # by the merge job. Provenance/SBOM are attached there as signed
      # attestations on the final index digest rather than as per-platform
      # buildkit attestation manifests, which `imagetools create` would drop.
      - name: Build and push by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.suffix }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          # `--` delimits the target: with a single `-`, the `runtime`
          # merge job's `digests-runtime-*` pattern also matched the
          # operator's `digests-runtime-operator-amd64`, and `imagetools
          # create` then failed on a digest absent from the animusd repo.
          name: digests--${{ matrix.target }}--${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish (${{ matrix.image }})
    # Tags are only ever created for push events (never for a PR).
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless + attestations
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: animus-db/animusd
            target: runtime
          - image: animus-db/animus-operator
            target: runtime-operator
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests--${{ matrix.target }}--*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` and the tag name only apply to push events. Tag pushes
      # additionally get the bare SemVer (`0.1.0-alpha.0`; `major.minor` is
      # not emitted for a pre-release).
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create the manifest list and push
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ matrix.image }}@sha256:%s ' *)

      - name: Resolve the index digest
        id: digest
        run: |
          set -euo pipefail
          first_tag="$(jq -r '.tags[0]' <<<"$DOCKER_METADATA_OUTPUT_JSON")"
          docker buildx imagetools inspect "$first_tag"
          digest="$(docker buildx imagetools inspect "$first_tag" --format '{{json .Manifest}}' | jq -r '.digest')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Sign the manifest list by digest, never by tag (tags are mutable).
      # Keyless: identity is this workflow run via Sigstore OIDC.
      - name: Sign the image (cosign keyless)
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ matrix.image }}@${{ steps.digest.outputs.digest }}"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ matrix.image }}@${{ steps.digest.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false

      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ matrix.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ matrix.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
