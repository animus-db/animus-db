name: corpus-deep

# The deep tier of the fault-injection scenario corpora (deterministic
# SimEnv): every structural cell explored over many seeds, plus the extended
# dimension set where applicable. This is far too large for the per-push
# `cargo test` gate, so it runs on a nightly schedule (and on demand)
# instead. The default `cargo test` still runs each corpus's frozen base set
# on every push via the `gates` job in ci.yml.
on:
  schedule:
    # 03:17 UTC nightly (off the hour to avoid the scheduler stampede).
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      txn_seeds:
        description: "Seeds per structural cell (ANIMUS_TXN_SEEDS, ADR 0018 multi-tablet txn corpus)"
        required: false
        default: "40"
      stream_seeds:
        description: "Seeds per structural cell (ANIMUS_STREAM_SEEDS, ADR 0042/0043 streams lineage corpus)"
        required: false
        default: "40"
      backfill_seeds:
        description: "Seeds per structural cell (ANIMUS_BACKFILL_SEEDS, ADR 0045 backfill fault corpus)"
        required: false
        default: "40"
      split_seeds:
        description: "Seeds per structural cell (ANIMUS_SPLIT_SEEDS, ADR 0050 split-build corpus)"
        required: false
        default: "40"
      reconciler_seeds:
        description: "Seeds per scenario (ANIMUS_RECONCILER_SEEDS, ADR 0031 reconciler lifecycle corpus)"
        required: false
        default: "40"
      quiesce_seeds:
        description: "Seeds per property (ANIMUS_QUIESCE_SEEDS, ADR 0048 quiescence corpus)"
        required: false
        default: "40"
      learner_seeds:
        description: "Seeds per scenario (ANIMUS_LEARNER_SEEDS, ADR 0058 Train 1 learner-membership corpus)"
        required: false
        default: "40"
      inplace_split_seeds:
        description: "Seeds per scenario (ANIMUS_INPLACE_SPLIT_SEEDS, ADR 0058 Train 2 rung 3 in-place split corpus)"
        required: false
        default: "40"
      backup_seeds:
        description: "Seeds per scenario (ANIMUS_BACKUP_SEEDS, ADR 0059 Train 1 backup-capture fault corpus)"
        required: false
        default: "40"
      pitr_seeds:
        description: "Seeds per scenario (ANIMUS_PITR_SEEDS, ADR 0059 Train 3 PITR sealing fault corpus)"
        required: false
        default: "40"

# One deep run at a time. The corpora are long-running and share the same
# runner class as CI, so an on-demand `workflow_dispatch` queues behind a
# nightly still in flight rather than running alongside it; nothing is
# cancelled, because a scheduled run that never reports is a silent gap in
# the nightly record.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  deep-corpus:
    name: deep-corpus
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (1.96)
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # Every corpus step below carries `continue-on-error: true` and an
      # `id:`. Without both, a step's own failure aborts the job and skips
      # every step after it — GitHub Actions' default sequential-steps
      # behavior — so a single broken corpus silently hides whatever the
      # other nine were going to report, night after night. The trailing
      # "Report corpus results" step turns each step's recorded outcome
      # back into one overall job failure, so CI still goes red on a real
      # regression, but only after every corpus has actually had a chance
      # to run and be seen.

      # ADR 0018's multi-tablet cross-transaction corpus: the 2PC protocol
      # (stage/commit/resolve + the recovery push) under fault injection,
      # scaled to depth. Each scenario is a pure function of its seed, so a
      # failure names one scenario + seed and is replayable.
      - name: deep multi-tablet transaction corpus (ADR 0018 serializability)
        id: txn
        continue-on-error: true
        env:
          ANIMUS_TXN_SEEDS: ${{ github.event.inputs.txn_seeds || '40' }}
        run: cargo test -p animus-test --test txn_serializable -- --nocapture

      # ADR 0042/0043's DynamoDB Streams lineage-walk corpus: exactly-once +
      # per-item order + chain continuity under seals/splits/leader-kills/
      # store faults, scaled to depth. Each cell is a pure function of its
      # seed, so a failure names one cell + seed and is replayable.
      - name: deep streams lineage corpus (ADR 0042/0043 exactly-once + lineage)
        id: streams
        continue-on-error: true
        env:
          ANIMUS_STREAM_SEEDS: ${{ github.event.inputs.stream_seeds || '40' }}
        run: cargo test -p animus-test --test stream_lineage_corpus -- --nocapture

      # ADR 0045's secondary-index backfill seeder + completion aggregator:
      # coverage/convergence under concurrent splits, leader kills, live
      # writes, multiple indexes, and drop-table, scaled to depth. Each cell
      # is a pure function of its seed, so a failure names one cell + seed
      # and is replayable.
      - name: deep backfill fault corpus (ADR 0045 coverage + convergence)
        id: backfill
        continue-on-error: true
        env:
          ANIMUS_BACKFILL_SEEDS: ${{ github.event.inputs.backfill_seeds || '40' }}
        run: cargo test -p animus-test --test backfill_fault_corpus -- --nocapture

      # ADR 0050's copy-based split-build corpus: SeedBatch idempotence +
      # child-replica crash/partition/duplicate-delivery during a build,
      # scaled to depth. Each cell is a pure function of its seed.
      - name: deep split-build corpus (ADR 0050 seed/convergence)
        id: split
        continue-on-error: true
        env:
          ANIMUS_SPLIT_SEEDS: ${{ github.event.inputs.split_seeds || '40' }}
        run: cargo test -p animus-cp-data --test seed_batch -- --nocapture

      # ADR 0031's reconciler lifecycle corpus (post-ADR 0050 lifecycle
      # scenarios: Building host, cutover, reclaim, crash/restart over
      # per-tablet engines), scaled to depth.
      - name: deep reconciler lifecycle corpus (ADR 0031/0050)
        id: reconciler
        continue-on-error: true
        env:
          ANIMUS_RECONCILER_SEEDS: ${{ github.event.inputs.reconciler_seeds || '40' }}
        run: cargo test -p animus-cp-data --test reconciler_corpus -- --nocapture

      # ADR 0048's quiescence property corpus, scaled to depth.
      - name: deep quiescence corpus (ADR 0048)
        id: quiesce
        continue-on-error: true
        env:
          ANIMUS_QUIESCE_SEEDS: ${{ github.event.inputs.quiesce_seeds || '40' }}
        run: cargo test -p animus-cp-data --test quiescence -- --nocapture

      # ADR 0058 Train 1's learner (non-voting) membership-class corpus:
      # catch-up under partition, leader change mid-catch-up, and the
      # snapshot race, scaled to depth. Each scenario is a pure function of
      # its seed, so a failure names one scenario + seed and is replayable.
      - name: deep learner membership corpus (ADR 0058 Train 1)
        id: learner
        continue-on-error: true
        env:
          ANIMUS_LEARNER_SEEDS: ${{ github.event.inputs.learner_seeds || '40' }}
        run: cargo test -p animus-control --test learner_corpus -- --nocapture

      # ADR 0058 Train 2 rung 3's in-place split group-mint-at-apply corpus:
      # the full happy path, a leader crash mid-catch-up, the G4 crash
      # window (engine committed, group not yet started), and a concurrent
      # unrelated rebalance racing the split's own learner-add, scaled to
      # depth. Each scenario is a pure function of its seed, so a failure
      # names one scenario + seed and is replayable.
      - name: deep in-place split corpus (ADR 0058 Train 2 rung 3)
        id: inplace_split
        continue-on-error: true
        env:
          ANIMUS_INPLACE_SPLIT_SEEDS: ${{ github.event.inputs.inplace_split_seeds || '40' }}
        run: cargo test -p animus-cp-data --test inplace_split_reconciler -- --nocapture

      # ADR 0059 Train 1's on-demand backup capture driver + completion
      # aggregator: concurrent writes, leader kills, a capture-driver
      # restart, a split racing capture (§6 re-planning), and backup-store
      # fault injection, scaled to depth. Each scenario is a pure function
      # of its seed, so a failure names one scenario + seed and is
      # replayable.
      - name: deep backup capture corpus (ADR 0059 Train 1)
        id: backup
        continue-on-error: true
        env:
          ANIMUS_BACKUP_SEEDS: ${{ github.event.inputs.backup_seeds || '40' }}
        run: cargo test -p animus-test --test backup_fault_corpus -- --nocapture

      # ADR 0059 Train 3's PITR sealing consumer arm: leader kills mid-seal,
      # disable/re-enable generation resets, split interplay, and the
      # retention janitor's own keep-anchor predicate under randomized
      # interleavings, scaled to depth.
      - name: deep PITR sealing corpus (ADR 0059 Train 3)
        id: pitr
        continue-on-error: true
        env:
          ANIMUS_PITR_SEEDS: ${{ github.event.inputs.pitr_seeds || '40' }}
        run: cargo test -p animus-test --test pitr_fault_corpus -- --nocapture

      # Turns each corpus step's individually-recorded outcome back into one
      # overall job failure. `if: always()` makes this step run even though
      # every step above may have failed; without it, this step itself would
      # be skipped by the same default sequential-steps behavior this whole
      # continue-on-error scheme exists to route around.
      - name: Report corpus results
        if: always()
        run: |
          declare -A outcomes=(
            [txn]="${{ steps.txn.outcome }}"
            [streams]="${{ steps.streams.outcome }}"
            [backfill]="${{ steps.backfill.outcome }}"
            [split]="${{ steps.split.outcome }}"
            [reconciler]="${{ steps.reconciler.outcome }}"
            [quiesce]="${{ steps.quiesce.outcome }}"
            [learner]="${{ steps.learner.outcome }}"
            [inplace_split]="${{ steps.inplace_split.outcome }}"
            [backup]="${{ steps.backup.outcome }}"
            [pitr]="${{ steps.pitr.outcome }}"
          )
          failed=0
          for name in txn streams backfill split reconciler quiesce learner inplace_split backup pitr; do
            outcome="${outcomes[$name]}"
            echo "${name}: ${outcome}"
            if [ "${outcome}" != "success" ]; then
              failed=1
            fi
          done
          exit "${failed}"
