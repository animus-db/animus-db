name: corpus-deep

# The deep tier of the fault-injection scenario corpora (deterministic
# SimEnv): every structural cell explored over many seeds, plus the extended
# dimension set where applicable. This is far too large for the per-push
# `cargo test` gate, so it runs on a nightly schedule (and on demand)
# instead. The default `cargo test` still runs each corpus's frozen base set
# on every push via the `gates` job in ci.yml.
on:
  schedule:
    # 03:17 UTC nightly (off the hour to avoid the scheduler stampede).
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      txn_seeds:
        description: "Seeds per structural cell (ANIMUS_TXN_SEEDS, ADR 0018 multi-tablet txn corpus)"
        required: false
        default: "40"
      stream_seeds:
        description: "Seeds per structural cell (ANIMUS_STREAM_SEEDS, ADR 0042/0043 streams lineage corpus)"
        required: false
        default: "40"
      backfill_seeds:
        description: "Seeds per structural cell (ANIMUS_BACKFILL_SEEDS, ADR 0045 backfill fault corpus)"
        required: false
        default: "40"
      split_seeds:
        description: "Seeds per structural cell (ANIMUS_SPLIT_SEEDS, ADR 0050 split-build corpus)"
        required: false
        default: "40"
      reconciler_seeds:
        description: "Seeds per scenario (ANIMUS_RECONCILER_SEEDS, ADR 0031 reconciler lifecycle corpus)"
        required: false
        default: "40"
      quiesce_seeds:
        description: "Seeds per property (ANIMUS_QUIESCE_SEEDS, ADR 0048 quiescence corpus)"
        required: false
        default: "40"

# One deep run at a time. The corpora are long-running and share the same
# runner class as CI, so an on-demand `workflow_dispatch` queues behind a
# nightly still in flight rather than running alongside it; nothing is
# cancelled, because a scheduled run that never reports is a silent gap in
# the nightly record.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  deep-corpus:
    name: deep-corpus
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (1.96)
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # ADR 0018's multi-tablet cross-transaction corpus: the 2PC protocol
      # (stage/commit/resolve + the recovery push) under fault injection,
      # scaled to depth. Each scenario is a pure function of its seed, so a
      # failure names one scenario + seed and is replayable.
      - name: deep multi-tablet transaction corpus (ADR 0018 serializability)
        env:
          ANIMUS_TXN_SEEDS: ${{ github.event.inputs.txn_seeds || '40' }}
        run: cargo test -p animus-test --test txn_serializable -- --nocapture

      # ADR 0042/0043's DynamoDB Streams lineage-walk corpus: exactly-once +
      # per-item order + chain continuity under seals/splits/leader-kills/
      # store faults, scaled to depth. Each cell is a pure function of its
      # seed, so a failure names one cell + seed and is replayable.
      - name: deep streams lineage corpus (ADR 0042/0043 exactly-once + lineage)
        env:
          ANIMUS_STREAM_SEEDS: ${{ github.event.inputs.stream_seeds || '40' }}
        run: cargo test -p animus-test --test stream_lineage_corpus -- --nocapture

      # ADR 0045's secondary-index backfill seeder + completion aggregator:
      # coverage/convergence under concurrent splits, leader kills, live
      # writes, multiple indexes, and drop-table, scaled to depth. Each cell
      # is a pure function of its seed, so a failure names one cell + seed
      # and is replayable.
      - name: deep backfill fault corpus (ADR 0045 coverage + convergence)
        env:
          ANIMUS_BACKFILL_SEEDS: ${{ github.event.inputs.backfill_seeds || '40' }}
        run: cargo test -p animus-test --test backfill_fault_corpus -- --nocapture

      # ADR 0050's copy-based split-build corpus: SeedBatch idempotence +
      # child-replica crash/partition/duplicate-delivery during a build,
      # scaled to depth. Each cell is a pure function of its seed.
      - name: deep split-build corpus (ADR 0050 seed/convergence)
        env:
          ANIMUS_SPLIT_SEEDS: ${{ github.event.inputs.split_seeds || '40' }}
        run: cargo test -p animus-cp-data --test seed_batch -- --nocapture

      # ADR 0031's reconciler lifecycle corpus (post-ADR 0050 lifecycle
      # scenarios: Building host, cutover, reclaim, crash/restart over
      # per-tablet engines), scaled to depth.
      - name: deep reconciler lifecycle corpus (ADR 0031/0050)
        env:
          ANIMUS_RECONCILER_SEEDS: ${{ github.event.inputs.reconciler_seeds || '40' }}
        run: cargo test -p animus-cp-data --test reconciler_corpus -- --nocapture

      # ADR 0048's quiescence property corpus, scaled to depth.
      - name: deep quiescence corpus (ADR 0048)
        env:
          ANIMUS_QUIESCE_SEEDS: ${{ github.event.inputs.quiesce_seeds || '40' }}
        run: cargo test -p animus-cp-data --test quiescence -- --nocapture
