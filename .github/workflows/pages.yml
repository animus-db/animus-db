# Publish the marketing site (website/) to GitHub Pages.
#
# The site is static HTML/CSS/JS; the one build step compiles the in-browser
# demo's WebAssembly (crates/animus-web, ADR 0082) into `website/demo/pkg/`
# (gitignored), then the job uploads `website/` as the Pages artifact. `website/CNAME` carries the custom domain
# (animusdb.io) and `website/.nojekyll` stops Pages from running Jekyll over it.
#
# Enable once in the repository: Settings → Pages → Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/build-web-demo.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Install Rust toolchain (1.96) with the wasm target
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # The CLI must match the `wasm-bindgen` crate version in Cargo.lock
      # exactly; read it from there so the two cannot drift.
      - name: Install wasm-bindgen-cli (version from Cargo.lock)
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/ {getline; gsub(/[^0-9.]/, "", $0); print; exit}' Cargo.lock)
          echo "wasm-bindgen ${v}"
          cargo install wasm-bindgen-cli --version "${v}" --locked

      # No wasm-opt pass: measured on this crate, `wasm-opt -Oz` shrank the raw
      # file ~13% but grew it ~10% gzipped (what Pages serves), over a build
      # that is already `opt-level = "s"` + fat LTO (`profile.wasm-release`).
      - name: Build the browser demo (website/demo/pkg)
        run: scripts/build-web-demo.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
