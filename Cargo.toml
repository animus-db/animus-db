# AnimusDB — Cargo workspace root.
#
# A masterless, linearly-scalable NoSQL database in Rust. See README.md and the
# architecture decision records under docs/adr/ for the design rationale.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-only"
repository = "https://github.com/animusdb/animusdb"
authors = ["The AnimusDB Authors"]

[workspace.dependencies]
# Internal crates (path deps so the workspace builds standalone).
animus-env = { path = "crates/animus-env" }
animus-sim = { path = "crates/animus-sim" }
animus-storage = { path = "crates/animus-storage" }
animus-control = { path = "crates/animus-control" }
animus-tablet = { path = "crates/animus-tablet" }
animus-placement = { path = "crates/animus-placement" }
animus-consensus = { path = "crates/animus-consensus" }
animus-cp-data = { path = "crates/animus-cp-data" }
animus-cql = { path = "crates/animus-cql" }
animus-dynamo = { path = "crates/animus-dynamo" }
animus-test = { path = "crates/animus-test" }
animusd = { path = "crates/animusd" }

# Third-party.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "sync",
    "fs",
    "signal",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# OpenTelemetry-compatible distributed tracing export (ADR 0027). Scoped to
# `animusd` only — every other crate stays on the plain `tracing` facade.
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = "0.32"
tracing-opentelemetry = "0.33"
async-trait = "0.1"
futures = "0.3"
crc32fast = "1"
# Pure-Rust LZ4 block (de)compressor for SSTable data blocks (ADR 0008). MIT
# licensed; built with only its safe (no-unsafe) encode/decode paths, so it
# honours the workspace `unsafe_code = "forbid"` posture and adds no C/FFI.
lz4_flex = { version = "0.13", default-features = false, features = [
    "safe-encode",
    "safe-decode",
    "std",
] }
rand = "0.8"
rand_chacha = "0.3"
proptest = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Determinism is the load-bearing constraint (see docs/adr/0003). HashMap/HashSet
# iteration order is nondeterministic; system code must use BTreeMap/BTreeSet.
# These lints are a backstop, not a substitute for review.
disallowed_types = "warn"

[profile.release]
debug = 1
