[package]
name = "animus-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "AnimusDB StorageEngine trait + in-memory implementation."

[lints]
workspace = true

# Off by default. Gates the real-thread (`#[tokio::test(flavor =
# "multi_thread")]`) `ProdEnv` liveness/concurrency test binaries below, so a
# plain `cargo test -p animus-storage` (the CI `gates` job) never schedules
# them — they need dedicated cores to avoid the 2-vCPU shared-runner
# starvation tracked in issue #286/#280. `prod-liveness` in ci.yml runs them
# explicitly via `--features prod-heavy`.
[features]
prod-heavy = []

[dependencies]
async-trait.workspace = true
thiserror.workspace = true
animus-env.workspace = true
crc32fast.workspace = true
lz4_flex.workspace = true
serde = { workspace = true }
serde_json.workspace = true

[dev-dependencies]
# This crate's own library never constructs a `ProdEnv` — only its real-thread
# liveness/regression tests and `engine_bench` do, so `prod` is opted into
# here, not on the `[dependencies]` entry above (ADR 0061 rung C0).
animus-env = { workspace = true, features = ["prod"] }
animus-sim.workspace = true
# Shared corpus seed-management scaffolding (ADR 0061 rung B1,
# `animus_test::corpus`). This is a dev-dependency cycle (animus-test's own
# dev-dependencies include animus-storage), which Cargo permits: a dev-dep
# cycle only needs to resolve for `cargo test`, never for building either
# crate's library.
animus-test.workspace = true
futures.workspace = true
proptest.workspace = true
tokio = { workspace = true }

# A hand-rolled throughput/latency benchmark (no external bench framework), run
# with `cargo bench -p animus-storage`. `harness = false` => it's a plain `main`.
[[bench]]
name = "engine_bench"
harness = false

# Real-thread `ProdEnv` tests (issue #286/#280): explicit `[[test]]` stanzas so
# `required-features` can gate them off the default `cargo test` run. Adding
# these does not disable Cargo's autodiscovery of the crate's other
# `tests/*.rs` binaries (autotests stays on).
[[test]]
name = "lsm_concurrent"
path = "tests/lsm_concurrent.rs"
required-features = ["prod-heavy"]

[[test]]
name = "idle_engine_cost"
path = "tests/idle_engine_cost.rs"
required-features = ["prod-heavy"]
