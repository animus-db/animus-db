[package]
name = "animus-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "AnimusDB control plane: Raft-replicated metadata state machine."

[lints]
workspace = true

# Off by default. Gates the real-thread (`#[tokio::test(flavor =
# "multi_thread")]`) `ProdEnv` liveness test binaries below, so a plain
# `cargo test -p animus-control` (the CI `gates` job) never schedules them —
# they need dedicated cores to avoid the 2-vCPU shared-runner starvation
# tracked in issue #286/#280. `prod-liveness` in ci.yml runs them explicitly
# via `--features prod-heavy`.
[features]
prod-heavy = []

[dependencies]
animus-env.workspace = true
animus-tablet.workspace = true
animus-placement.workspace = true
# The system-keyspace engine mirror (ADR 0038 PR2, `mirror.rs`): the mirror
# writes through the plain `StorageEngine` trait (`merge_batch`), the same
# per-key-LWW primitive the leaderful CP data plane's own apply path uses.
animus-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
tracing.workspace = true
# Per-record WAL checksum (`persist.rs`, issue #495) — the same crate/impl
# `animus-storage`'s own CRC-checked SSTable/WAL framing uses (`crc32fast::
# hash`), reused rather than a second dependency for the same job.
crc32fast.workspace = true

[dev-dependencies]
# This crate's own library never constructs a `ProdEnv` — only its real-thread
# liveness tests do (`tests/prod_liveness.rs`, `tests/control_membership_prod.rs`),
# so `prod` is opted into here, not on the `[dependencies]` entry above
# (ADR 0061 rung C0).
animus-env = { workspace = true, features = ["prod"] }
animus-sim.workspace = true
# Shared corpus seed-management scaffolding (ADR 0061 rung B1,
# `animus_test::corpus`). This is a dev-dependency cycle (animus-test's own
# dev-dependencies include animus-control), which Cargo permits: a dev-dep
# cycle only needs to resolve for `cargo test`, never for building either
# crate's library.
animus-test.workspace = true
# Real-time `ProdEnv` liveness tests (the driver-liveness guarantee, ADR 0009/0017):
# `SimEnv`'s virtual time can't trip the wall-clock election timeout, so the
# no-election-storm property is only observable over `ProdEnv` on real threads.
tokio.workspace = true

# Real-thread `ProdEnv` tests (issue #286/#280): explicit `[[test]]` stanzas so
# `required-features` can gate them off the default `cargo test` run. Adding
# these does not disable Cargo's autodiscovery of the crate's other
# `tests/*.rs` binaries (autotests stays on).
[[test]]
name = "prod_liveness"
path = "tests/prod_liveness.rs"
required-features = ["prod-heavy"]

[[test]]
name = "control_membership_prod"
path = "tests/control_membership_prod.rs"
required-features = ["prod-heavy"]
