[package]
name = "animus-cp-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "AnimusDB leaderful per-tablet Raft data plane (linearizable KV)."

[lints]
workspace = true

# Off by default. Gates the real-thread (`#[tokio::test(flavor =
# "multi_thread")]`) `ProdEnv` regression test binary below, so a plain
# `cargo test -p animus-cp-data` (the CI `gates` job) never schedules it — it
# needs dedicated cores to avoid the 2-vCPU shared-runner starvation tracked
# in issue #286/#280. `prod-liveness` in ci.yml runs it explicitly via
# `--features prod-heavy`.
[features]
prod-heavy = []

[dependencies]
animus-env.workspace = true
animus-control.workspace = true
animus-storage.workspace = true
animus-tablet.workspace = true
# ClusterSegmentStore's K-replica placement selection (ADR 0043 §A7b) reuses
# this crate's existing policy engine rather than a bespoke one — was a
# dev-only test dependency until now.
animus-placement.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
tracing.workspace = true
async-trait.workspace = true

[dev-dependencies]
# This crate's own library never constructs a `ProdEnv` — only its real-thread
# regression tests do (`tests/prod_concurrent_ts_monotonic.rs`,
# `tests/prod_compaction_persist_round.rs`), so `prod` is opted into here, not
# on the `[dependencies]` entry above (ADR 0061 rung C0).
animus-env = { workspace = true, features = ["prod"] }
animus-sim.workspace = true
# Shared corpus seed-management scaffolding (ADR 0061 rung B1,
# `animus_test::corpus`). This is a dev-dependency cycle (animus-test's own
# dev-dependencies include animus-cp-data), which Cargo permits: a dev-dep
# cycle only needs to resolve for `cargo test`, never for building either
# crate's library.
animus-test.workspace = true
# Real-thread `ProdEnv` regression (`tests/prod_concurrent_ts_monotonic.rs`):
# the mint/propose-ordering race this guards is provably unreachable under
# `SimEnv`'s single-threaded cooperative scheduler (no `.await` point exists
# between minting a ts and appending it to the log for two tasks to
# interleave at), so this one test needs genuine OS-thread parallelism.
tokio.workspace = true

# Real-thread `ProdEnv` test (issue #286/#280): an explicit `[[test]]` stanza
# so `required-features` can gate it off the default `cargo test` run. Adding
# this does not disable Cargo's autodiscovery of the crate's other
# `tests/*.rs` binaries (autotests stays on).
[[test]]
name = "prod_concurrent_ts_monotonic"
path = "tests/prod_concurrent_ts_monotonic.rs"
required-features = ["prod-heavy"]

# Real-thread `ProdEnv` test (issue #279): the consensus loop's persist rounds
# race the apply task's compaction rewrite for the WAL, which only genuine
# OS-thread parallelism exercises. Same `required-features` gating as above.
[[test]]
name = "prod_compaction_persist_round"
path = "tests/prod_compaction_persist_round.rs"
required-features = ["prod-heavy"]
