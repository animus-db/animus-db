[package]
name = "animus-operator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Kubernetes operator for AnimusDB clusters (AnimusCluster CRD)."

[lints]
workspace = true

[lib]
name = "animus_operator"
path = "src/lib.rs"

[[bin]]
name = "animus-operator"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
kube = { version = "4.2.0", default-features = false, features = ["runtime", "derive", "client", "rustls-tls"] }
k8s-openapi = { version = "0.28.0", features = ["latest", "schemars"] }
schemars = "1.2.2"
hyper = { version = "1.11.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1.5"
serde_yaml = "0.9.34"
bytes = "1.12.1"
http = "1.5.0"

[dev-dependencies]
