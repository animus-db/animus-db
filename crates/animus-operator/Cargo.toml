[package]
name = "animus-operator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Kubernetes operator for AnimusDB clusters (AnimusCluster CRD)."

[lints]
workspace = true

[lib]
name = "animus_operator"
path = "src/lib.rs"

[[bin]]
name = "animus-operator"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The `ClusterApi`/`AdminOps` test seams (ADR 0061 rung E1) are `#[async_trait]`
# rather than native RPITIT: this crate's traits are consumed generically
# (never as `dyn`), but `kube::runtime::Controller::run` drives the
# reconciler on a multi-threaded runtime, so every future crossing the seam
# must be `Send` — `async_trait` boxes it and gets that for free, matching
# the pattern already used for `animus-env`'s `Env`/`StorageEngine` seams
# elsewhere in the workspace (see `crates/animus-operator/CLAUDE.md`).
async-trait.workspace = true
kube = { version = "4.2.0", default-features = false, features = ["runtime", "derive", "client", "rustls-tls"] }
# kube's `rustls-tls` leaves the rustls CryptoProvider choice to the
# application (rustls 0.23 panics at client build without exactly one
# provider); main.rs installs ring explicitly.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
k8s-openapi = { version = "0.28.0", features = ["latest", "schemars"] }
schemars = "1.2.2"
hyper = { version = "1.11.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1.5"
serde_yaml = "0.9.34"
bytes = "1.12.1"
http = "1.5.0"

[dev-dependencies]
# `tokio::time::pause`/`start_paused = true`, for the `drain_and_remove_node`
# never-completes test: `tokio::time::sleep`'s real-clock use in the drain
# poll loop is the correct call outside the `Env` seam (ADR 0061 Decision 4,
# see `controller.rs`'s `#[allow(clippy::disallowed_methods, ...)]` there),
# but a test still needs its 120 polls x 5s to resolve without 10 minutes of
# real wall-clock wait.
tokio = { workspace = true, features = ["test-util"] }
