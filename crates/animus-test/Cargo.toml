[package]
name = "animus-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "AnimusDB Elle-style history recorder + checker."

[lints]
workspace = true

[dependencies]
# The upgrade-restart transcode table (`upgrade::transcode`) drives a stopped
# node's `SimEnv` disk. animus-test is only ever a dev-dependency of other
# crates (never in a production build), and `animus-env` here has its default
# features only (no `prod`).
animus-env.workspace = true
animus-sim.workspace = true
# `src/upgrade/transcode.rs` (library code of this test-only crate, never a
# production dependency) calls the `legacy-encoders`-gated `reframe_to_v1`.
animus-control = { workspace = true, features = ["legacy-encoders"] }
# Likewise `reframe_wal_to_v1` (the `lsm-wal` v2 -> v1 transcode).
animus-storage = { workspace = true, features = ["legacy-encoders"] }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# `legacy-encoders` (ADR 0073 "Legacy encoders are test-only"): the test-only
# `legacy::vN::encode` functions the transcode table calls. Enabled here, on
# dev-dependency entries only, so no production build ever compiles them.
animus-env = { workspace = true, features = ["legacy-encoders"] }
animus-control = { workspace = true, features = ["legacy-encoders"] }
animus-cp-data = { workspace = true, features = ["legacy-encoders"] }
animus-dynamo.workspace = true
animus-item.workspace = true
animus-tablet.workspace = true
flate2.workspace = true
