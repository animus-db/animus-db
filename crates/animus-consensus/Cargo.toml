[package]
name = "animus-consensus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "AnimusDB Accord-style leaderless transaction consensus."

[lints]
workspace = true

# Off by default. Gates the real-thread (`#[tokio::test(flavor =
# "multi_thread")]`) `ProdEnv` liveness test binary below, so a plain `cargo
# test -p animus-consensus` (the CI `gates` job) never schedules it — it
# needs dedicated cores to avoid the 2-vCPU shared-runner starvation tracked
# in issue #286/#280. `prod-liveness` in ci.yml runs it explicitly via
# `--features prod-heavy`.
[features]
prod-heavy = []

[dependencies]
animus-env.workspace = true
animus-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
animus-sim.workspace = true
futures.workspace = true
tokio = { workspace = true }

# Real-thread `ProdEnv` test (issue #286/#280): an explicit `[[test]]` stanza
# so `required-features` can gate it off the default `cargo test` run. Adding
# this does not disable Cargo's autodiscovery of the crate's other
# `tests/*.rs` binaries (autotests stays on).
[[test]]
name = "accord_concurrent"
path = "tests/accord_concurrent.rs"
required-features = ["prod-heavy"]
