[package]
name = "animusd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "AnimusDB node server daemon."

[lints]
workspace = true

[lib]
name = "animusd"
path = "src/lib.rs"

[[bin]]
name = "animusd"
path = "src/main.rs"

[dependencies]
animus-env.workspace = true
animus-control.workspace = true
animus-cp-data.workspace = true
animus-storage.workspace = true
animus-tablet.workspace = true
animus-dynamo.workspace = true
animus-cql.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# `futures::future::join_all` — the multi-participant 2PC coordinator's
# concurrent-prepare fan-out (ADR 0018 §2/PR4, `ClientCtx::cp_txn`).
futures.workspace = true
# Real (non-`Env`) randomness, used in exactly one deliberate, narrowly
# commented place: `generate_join_nonce` at the CLI pre-bind boundary of a
# cluster-allocated-id join (ADR 0036) — a leaf that never runs under
# `SimEnv`. See that function's doc before adding another caller.
rand.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true

[dev-dependencies]
tempfile = "3"
# For the reconfigure-loop test (#3), which drives the replicated tablet map
# directly: `CasTabletReplicas` needs `TabletId` + `Epoch`.
animus-tablet.workspace = true
opentelemetry-proto = { version = "0.32.0", default-features = false, features = [
    "gen-tonic-messages",
    "trace",
] }
prost = "0.14.4"
