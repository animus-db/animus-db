[package]
name = "animusd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "AnimusDB node server daemon."
# Explicit `[[test]]` list with `required-features = ["server"]` (see below).
autotests = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
disallowed_types = "warn"
# ADR 0003 / ADR 0061 Decision 4 (rung B5): animusd is the pre-Phase-C
# process-boundary crate (ADR 0061's `animus-node` carve-out hasn't happened
# yet) — real sockets, ~50 tokio::spawn sites, and real-time polling/backoff
# throughout node assembly, the wire edges, and the background loops are its
# entire job, not a determinism hole to close by review. A survey while
# adding this lint found ~600 real call sites (Instant::now/tokio::spawn/
# tokio::time::{sleep,timeout}) across 84 files in this crate's src+tests+
# benches alone — individually annotating each with `#[allow(...)]` would be
# a wall of copy-pasted reasons repeating "this is the process boundary,"
# not a review aid, and per-file annotation still means editing ~80 files
# for the same one reason. This package-level override is that one reason,
# stated once, deliberately more visible in review than a scattered `#[allow]`
# would be. disallowed_types (HashMap/HashSet) is unrelated to the process
# boundary and stays fully enforced.
#
# NARROWED by ADR 0061 Phase C's closing rung (the seventh 2026-08-28
# amendment). This package-level allow is no longer the whole story: the
# five `E: Env`-generic client-path modules (`schema`, `read_path`,
# `write_path`, `txn_coordinator`, `forwarding`) carry an explicit
# `#[deny(clippy::disallowed_methods)]` on their `mod` declarations in
# `lib.rs`, which overrides this allow for their whole bodies. That deny is
# what makes the determinism constraint compiler-enforced for the node's
# brain — the enforcement ADR 0061 Decision 1 originally expected from a
# crate boundary, which the orphan rule blocked. This allow now covers only
# the code that genuinely is the process boundary: `lib.rs` itself,
# `dynamo.rs`, the wire edges, the remaining loops, and the test/bench
# targets. Narrow it further as more modules become `Env`-seam-clean; do not
# widen it back.
disallowed_methods = "allow"

[lib]
name = "animusd"
path = "src/lib.rs"

[[bin]]
name = "animusd"
path = "src/main.rs"
required-features = ["server"]

[[bench]]
name = "cluster_bench"
harness = false
required-features = ["server"]

# R-01 sub-track (b): real-process chaos harness (docs/chaos.md). Opt-in so
# the per-push gates never schedule a multi-minute multi-process run; it is
# still compiled by `clippy --all-features`.
# Run: `cargo test -p animusd --features chaos --test chaos -- --test-threads=1`.
[features]
# `server` (default): the real node process — sockets, TLS, `ProdEnv`, the
# `animusd` binary, OpenTelemetry, signal handling. `embedded`: the in-crate
# `SimCluster` fixture exposed as the public `embedded::EmbeddedCluster`
# (deterministic, single-threaded, no sockets), buildable for
# `wasm32-unknown-unknown`. Everything the browser build must not link
# (tokio `net`/`fs`/`signal`/`rt-multi-thread`/`time`, rustls, socket2,
# opentelemetry, `ProdEnv`) hangs off `server`. At least one of the two
# must be on (`compile_error!` in `lib.rs`). See `CLAUDE.md`.
default = ["server"]
server = [
    "animus-env/prod",
    "animus-s3/prod",
    "tokio/net",
    "tokio/fs",
    "tokio/signal",
    "tokio/rt-multi-thread",
    "tokio/time",
    "dep:tokio-rustls",
    "dep:socket2",
    "dep:rand",
    "dep:flate2",
    "dep:tracing-subscriber",
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
]
embedded = ["dep:animus-sim", "animus-control/sim-versions"]
chaos = []
# R-01 sub-track (a): multi-hour/day soak harness (docs/soak.md). Opt-in for
# the same reason as `chaos`.
# Run: `ANIMUS_SOAK_DURATION=15m cargo test -p animusd --features soak --test soak -- --nocapture`.
soak = []
# ADR 0073 Phase 3 (P3-E, D10): the previous-release rolling-upgrade test
# (`tests/upgrade_previous_release.rs`). Opt-in because it needs the reference
# R-1 binary (`scripts/build-upgrade-from.sh`); with the feature on, a missing
# binary FAILS the test, it never skips. Still compiled by `clippy --all-features`.
# Run: `ANIMUS_UPGRADE_FROM_BIN=$(scripts/build-upgrade-from.sh) cargo test -p animusd --features upgrade-from --test upgrade_previous_release -- --nocapture --test-threads=1`.
upgrade-from = []

[[test]]
name = "chaos"
path = "tests/chaos.rs"
required-features = ["server", "chaos"]

[[test]]
name = "upgrade_previous_release"
path = "tests/upgrade_previous_release.rs"
required-features = ["server", "upgrade-from"]

[[test]]
name = "soak"
path = "tests/soak.rs"
required-features = ["server", "soak"]


