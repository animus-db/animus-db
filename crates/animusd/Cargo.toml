[package]
name = "animusd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "AnimusDB node server daemon."

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
disallowed_types = "warn"
# ADR 0003 / ADR 0061 Decision 4 (rung B5): animusd is the pre-Phase-C
# process-boundary crate (ADR 0061's `animus-node` carve-out hasn't happened
# yet) — real sockets, ~50 tokio::spawn sites, and real-time polling/backoff
# throughout node assembly, the wire edges, and the background loops are its
# entire job, not a determinism hole to close by review. A survey while
# adding this lint found ~600 real call sites (Instant::now/tokio::spawn/
# tokio::time::{sleep,timeout}) across 84 files in this crate's src+tests+
# benches alone — individually annotating each with `#[allow(...)]` would be
# a wall of copy-pasted reasons repeating "this is the process boundary,"
# not a review aid, and per-file annotation still means editing ~80 files
# for the same one reason. This package-level override is that one reason,
# stated once, deliberately more visible in review than a scattered `#[allow]`
# would be. disallowed_types (HashMap/HashSet) is unrelated to the process
# boundary and stays fully enforced.
#
# NARROWED by ADR 0061 Phase C's closing rung (the seventh 2026-08-28
# amendment). This package-level allow is no longer the whole story: the
# five `E: Env`-generic client-path modules (`schema`, `read_path`,
# `write_path`, `txn_coordinator`, `forwarding`) carry an explicit
# `#[deny(clippy::disallowed_methods)]` on their `mod` declarations in
# `lib.rs`, which overrides this allow for their whole bodies. That deny is
# what makes the determinism constraint compiler-enforced for the node's
# brain — the enforcement ADR 0061 Decision 1 originally expected from a
# crate boundary, which the orphan rule blocked. This allow now covers only
# the code that genuinely is the process boundary: `lib.rs` itself,
# `dynamo.rs`, the wire edges, the remaining loops, and the test/bench
# targets. Narrow it further as more modules become `Env`-seam-clean; do not
# widen it back.
disallowed_methods = "allow"

[lib]
name = "animusd"
path = "src/lib.rs"

[[bin]]
name = "animusd"
path = "src/main.rs"

[[bench]]
name = "cluster_bench"
harness = false

[dependencies]
async-trait.workspace = true
# `animusd` is the real node process — it's the one place that actually
# constructs a `ProdEnv` (ADR 0061 rung C0 gates it behind this feature).
animus-env = { workspace = true, features = ["prod"] }
# The `E: Env`-generic node core (ADR 0061 Phase C carve-out) this crate
# re-exports its wire types/`topology`/`decide` from at the crate root.
animus-node.workspace = true
animus-control.workspace = true
animus-cp-data.workspace = true
animus-storage.workspace = true
animus-tablet.workspace = true
animus-dynamo.workspace = true
# ADR 0054 step 2: `WriteSchema`/`derive_kind_writes` — `kind_writes_for_
# item`'s thin-wrapper body (`dynamo.rs`) builds the same frozen schema
# slice `animus-cp-data`'s own `KvCommand::KindEval` will carry once a
# producer exists (ADR 0054 step 3). `animus-dynamo` already re-exports the
# core item-model types (`Item`/`AttributeValue`/`TableSchema`/…) this crate
# uses without a direct dependency; this one is kept direct instead, since
# it is specifically apply-evaluator machinery a wire-protocol consumer of
# `animus-dynamo` has no reason to see re-exported.
animus-item.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# `futures::future::join_all` — the multi-participant 2PC coordinator's
# concurrent-prepare fan-out (ADR 0018 §2/PR4, `ClientCtx::cp_txn`).
futures.workspace = true
# Real (non-`Env`) randomness, used in exactly one deliberate, narrowly
# commented place: `generate_join_nonce` at the CLI pre-bind boundary of a
# cluster-allocated-id join (ADR 0036) — a leaf that never runs under
# `SimEnv`. See that function's doc before adding another caller.
rand.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
# TLS on the client/intra/admin/console listeners and every dialer (ADR
# 0064, S-01 commit 2) — the accept-side `TlsAcceptor`/`MaybeTlsStream`
# plumbing this crate's own listeners need on top of what `animus-env`
# (commit 1) already provides for the internal wire. Same pinned `ring`
# feature set as `animus-env`'s own `tokio-rustls` dependency (one crypto
# backend workspace-wide, ADR 0064 Decision 5).
tokio-rustls = { workspace = true }

[dev-dependencies]
tempfile = "3"
# The TLS test-PKI helper (`tests/support/mod.rs::tls_pki`, ADR 0064 commit
# 2) — a self-signed CA + per-node leaf certs, generated fresh per test run,
# never shipped. Mirrors `animus-env`'s own `prod::tests` use of the same
# crate (its helper is `#[cfg(test)]`-private to that crate, so this is an
# independent, small copy rather than a cross-crate reuse — see this
# crate's own `CLAUDE.md`).
rcgen = "0.13"
# `tests/tls_e2e.rs`'s own test-side TLS clients: a server-only `rustls`
# `ClientConfig` (no client cert — mirrors `animus-cli`'s `--tls-ca`) for
# the client/dynamo/admin/console ports, and reading the test PKI's PEM
# files directly for the intra-port mutual-TLS negative test. Test-only —
# `animusd`'s own production TLS material always goes through `animus-env`
# (already a normal dependency).
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
# For the reconfigure-loop test (#3), which drives the replicated tablet map
# directly: `CasTabletReplicas` needs `TabletId` + `Epoch`.
animus-tablet.workspace = true
# ADR 0061 Phase C's closing rung (the seventh 2026-08-28 amendment): an
# in-crate `#[cfg(test)] mod` in `lib.rs` constructs a real
# `ClientCtx<SimEnv, _>` and drives it deterministically — no sockets, no
# `ProdEnv`. Test-only: `animus-storage` (`MemoryEngine`) is already a
# normal (non-dev) dependency above, so only `animus-sim` needs adding here
# — unlike `animus-node`'s own dev-dependency of the same crate, this one
# carries no `prod`-feature-leak concern (this crate's `animus-env`
# dependency already enables `prod` unconditionally, since `animusd` is the
# one crate that genuinely constructs a `ProdEnv`).
animus-sim.workspace = true
# ADR 0061 rung D1 (C-04 D1 step 3): the SimCluster cycles/durability corpus
# (`sim_cluster_corpus.rs`) reuses `animus-test`'s `Recorder`/`History`
# model and `check_cycles`/`check_durability`/`check_convergence` checkers,
# mirroring every other fault-injection corpus in the workspace
# (`animus-test`/`animus-cp-data`/`animus-control` each already take this
# as a dev-dependency; no cycle — `animus-test`'s own `Cargo.toml` does not
# depend on `animusd`).
animus-test.workspace = true
opentelemetry-proto = { version = "0.32.0", default-features = false, features = [
    "gen-tonic-messages",
    "trace",
] }
prost = "0.14.4"
