<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>animusd console</title>
<link rel="stylesheet" href="/console/ui/console.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="logo" width="19" height="19" viewBox="-43 -43 86 86" aria-hidden="true">
      <circle cx="-26.14" cy="-15.09" r="2.4" fill="oklch(0.780 0.012 250.0)"></circle>
      <circle cx="-26.14" cy="0" r="3.04" fill="oklch(0.754 0.033 250.6)"></circle>
      <circle cx="-26.14" cy="15.09" r="2.4" fill="oklch(0.780 0.012 250.0)"></circle>
      <circle cx="-13.07" cy="-22.64" r="3.04" fill="oklch(0.754 0.033 250.6)"></circle>
      <circle cx="-15.5" cy="-8.95" r="4.89" fill="oklch(0.678 0.093 252.2)"></circle>
      <circle cx="-15.5" cy="8.95" r="4.89" fill="oklch(0.678 0.093 252.2)"></circle>
      <circle cx="-13.07" cy="22.64" r="3.04" fill="oklch(0.754 0.033 250.6)"></circle>
      <circle cx="0" cy="-30.19" r="2.4" fill="oklch(0.780 0.012 250.0)"></circle>
      <circle cx="0" cy="-17.89" r="4.89" fill="oklch(0.678 0.093 252.2)"></circle>
      <circle cx="0" cy="0" r="8" fill="oklch(0.550 0.195 255.0)"></circle>
      <circle cx="0" cy="17.89" r="4.89" fill="oklch(0.678 0.093 252.2)"></circle>
      <circle cx="0" cy="30.19" r="2.4" fill="oklch(0.780 0.012 250.0)"></circle>
      <circle cx="13.07" cy="-22.64" r="3.04" fill="oklch(0.754 0.033 250.6)"></circle>
      <circle cx="15.5" cy="-8.95" r="4.89" fill="oklch(0.678 0.093 252.2)"></circle>
      <circle cx="15.5" cy="8.95" r="4.89" fill="oklch(0.678 0.093 252.2)"></circle>
      <circle cx="13.07" cy="22.64" r="3.04" fill="oklch(0.754 0.033 250.6)"></circle>
      <circle cx="26.14" cy="-15.09" r="2.4" fill="oklch(0.780 0.012 250.0)"></circle>
      <circle cx="26.14" cy="0" r="3.04" fill="oklch(0.754 0.033 250.6)"></circle>
      <circle cx="26.14" cy="15.09" r="2.4" fill="oklch(0.780 0.012 250.0)"></circle>
    </svg>
    <span class="wordmark"><span class="name">animusd</span><span class="tag">console</span></span>
  </div>
  <span class="spacer"></span>
  <span class="scope-note">your tables &amp; items only — no cluster state</span>
  <span class="theme-switch" id="theme-switch" role="group" aria-label="theme">
    <button type="button" data-theme-choice="light" title="Light" aria-label="Light theme">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke-width="1.5">
        <circle cx="8" cy="8" r="3.2"></circle>
        <path d="M8 .8v2M8 13.2v2M.8 8h2M13.2 8h2M2.9 2.9l1.4 1.4M11.7 11.7l1.4 1.4M13.1 2.9l-1.4 1.4M4.3 11.7l-1.4 1.4"></path>
      </svg>
    </button>
    <button type="button" data-theme-choice="dark" title="Dark" aria-label="Dark theme">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke-width="1.5">
        <path d="M13.2 9.1A5.6 5.6 0 1 1 6.9 2.8a4.4 4.4 0 0 0 6.3 6.3Z"></path>
      </svg>
    </button>
    <button type="button" data-theme-choice="system" title="System" aria-label="Match system theme">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke-width="1.5">
        <rect x="1.6" y="2.6" width="12.8" height="8.6" rx="1.4"></rect>
        <path d="M5.6 14h4.8M8 11.2v2.8"></path>
      </svg>
    </button>
  </span>
</header>
<main id="app">
  <p class="loading">Loading animusd console…</p>
</main>
<script>
"use strict";
// Theme init/wiring — a UI preference only, persisted client-side. Mirrors
// dashboard_core.js's own theme mechanism (see its comment for the full
// rationale); duplicated here in a small inline script rather than pulled
// into console.js because this app has no shared "core" module and the
// logic is a handful of lines. Runs before console.js's router so the
// correct palette is set before the app paints its first screen.
const THEME_KEY = "animusd-console-theme";
function applyThemeChoice(choice) {
  const root = document.documentElement;
  if (choice === "light" || choice === "dark") root.dataset.theme = choice;
  else delete root.dataset.theme;
  document.querySelectorAll(".theme-switch button[data-theme-choice]").forEach((b) => {
    b.classList.toggle("active", b.dataset.themeChoice === choice);
  });
}
(function initTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  applyThemeChoice(saved === "dark" || saved === "system" ? saved : "light");
})();
document.getElementById("theme-switch").querySelectorAll("button[data-theme-choice]").forEach((b) => {
  b.addEventListener("click", () => {
    localStorage.setItem(THEME_KEY, b.dataset.themeChoice);
    applyThemeChoice(b.dataset.themeChoice);
  });
});
</script>
<script src="/console/ui/console.js"></script>
</body>
</html>
