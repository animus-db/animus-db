[package]
name = "animus-env"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "AnimusDB Env seam: Clock/Rng/Network/Disk/Spawner traits + ProdEnv."

[lints]
workspace = true

# Off by default (ADR 0061 rung C0). Gates `prod.rs` — `ProdEnv`,
# `FsSegmentStore`, `PreBindRng` — the crate's only real-time/real-IO/real-RNG
# implementation. The trait definitions (`Clock`/`Rng`/`Network`/`Disk`/
# `Spawner`/`SegmentStore`), `NodeId`, and `metrics.rs` need none of this and
# stay available unconditionally, so a crate can depend on `animus-env` with
# `default-features = false` and genuinely not have `ProdEnv` in its build —
# the prerequisite for the `animus-node` carve-out (ADR 0061 Phase C) to be a
# compiler-enforced boundary rather than a decorative one. See the ADR's
# 2026-08-28 amendment for why C1 needed this first.
[features]
prod = [
    "dep:tokio",
    "dep:rand",
    "dep:tracing",
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:rustls-pki-types",
    "dep:animus-s3",
]

[dependencies]
# Needed unconditionally: `async-trait` backs the trait definitions
# themselves (`Clock`/`Network`/`Disk`/`SegmentStore` in lib.rs, not just
# their `ProdEnv` impls); `serde`/`thiserror` back `NodeId`'s
# (de)serialization and `InvalidNodeId`.
async-trait.workspace = true
serde.workspace = true
thiserror.workspace = true
# Encryption at rest (ADR 0069): `encrypted.rs`'s `EncryptedDisk`/
# `EncryptedEnv` AEAD wrapper needs these unconditionally (not gated behind
# `prod`) so `SimEnv`-driven tests/corpora in other crates can exercise it
# without enabling ProdEnv at all.
chacha20poly1305.workspace = true
zeroize.workspace = true
# Needed only by `prod.rs` (real task spawning, OS randomness, and its
# `tracing::debug!`/`warn!` diagnostics) — gated by the `prod` feature above
# rather than declared unconditionally.
tokio = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
# TLS on the intra-node wire (ADR 0064). Gated by `prod` like the rest of
# this list — `TlsConfig`/`MaybeTlsStream` live in `prod.rs`.
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
# `s3_store.rs`'s `S3SegmentStore<T>` (S-04 PR 2, ADR 0059 amendment): wraps
# `animus_s3::client::S3Client<T>` behind the `SegmentStore` trait. Only
# `animus_s3::client`'s `Transport`-generic pieces are needed here — no
# `fake`/`prod` feature of `animus-s3` itself, since this crate never
# constructs a concrete `Transport` (that's `animusd`'s job for the real
# `HyperRustlsTransport`, and this crate's own dev-dependency below for
# tests). Optional, pulled in by the `prod` feature like every other real-IO
# dependency in this list.
animus-s3 = { workspace = true, optional = true }

[dev-dependencies]
# Self-signed CA + node cert generation for `prod::tests`' TLS loopback
# tests (ADR 0064) — never a production dependency, only ever a dev one.
rcgen = { workspace = true }
# `s3_store.rs`'s own contract test drives `S3SegmentStore` against
# `animus_s3::fake::FakeS3` (no sockets); `tests/s3_segment_store_minio.rs`
# is the opt-in real-endpoint counterpart and needs `animus_s3::prod::
# HyperRustlsTransport`, hence both features here. Cargo unifies this with
# the plain (feature-less) `[dependencies]` entry above when building this
# crate's own test targets with `--features prod`/`--all-features`.
animus-s3 = { workspace = true, features = ["fake", "prod"] }
